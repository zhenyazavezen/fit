<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark">
<meta name="build" content="ca37c9bb">
<title>SEVEN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A0A0B'/%3E%3Cpath d='M18 20h28L30 46' fill='none' stroke='%23ECEDEF' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Дизайн-токены SEVEN. Единственное место, где задаются цвета, радиусы, отступы и размеры.
   Компоненты (app.css) используют только эти переменные. Тема одна — тёмная. */
:root {
  color-scheme: dark;

  /* поверхности */
  --bg: #0A0A0B;
  --s1: #121214;
  --s2: #1A1A1D;
  --s3: #242428;
  --line: #303036;

  /* текст */
  --text: #F5F5F6;
  --text2: #A3A3AB;
  --text3: #8A8A93;

  /* светлые акценты (без ярких цветов) */
  --silver: #C7C9CF;
  --platinum: #ECEDEF;
  --on-platinum: #0A0A0B;
  --halo: rgba(239, 240, 242, 0.07);
  --danger: #E3A19F;
  --danger-bg: rgba(227, 161, 159, 0.1);

  /* типографика */
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --fs-xs: 11px;
  --fs-s: 13px;
  --fs-m: 15px;
  --fs-l: 17px;
  --fs-xl: 22px;
  --fs-xxl: 28px;

  /* радиусы */
  --r-s: 12px;
  --r-m: 16px;
  --r-l: 22px;
  --r-xl: 28px;

  /* отступы */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;

  /* размеры */
  --gutter: 20px;
  --touch: 44px;
  --tabbar-h: 64px;
  --btn-h: 56px;
  --maxw: 560px;

  /* Telegram и безопасные зоны (задаются из JS) */
  --tg-top: 0px;
  --tg-bottom: 0px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Компоненты и экраны SEVEN. Значения берутся из tokens.css. */
@font-face { font-family: 'Manrope'; src: local('Manrope'); font-display: swap; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-m); line-height: 1.45;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; border-radius: 6px; }

.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; }

/* ---------- каркас */
#app {
  height: var(--app-h, 100%); max-width: var(--maxw); margin: 0 auto; display: flex; flex-direction: column;
  background: var(--bg); position: relative; overflow: hidden;
}
#screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-top: var(--tg-top); outline: none; }
#screen.enter > * { animation: rise .26s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #screen.enter > *, .sheet, .scrim, .toast { animation: none !important; } * { transition: none !important; } }

.pad { padding: 0 max(var(--gutter), var(--safe-left)) var(--sp-8) max(var(--gutter), var(--safe-right)); }
.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.row-flex { display: flex; align-items: center; gap: var(--sp-3); }
.grow { flex: 1; min-width: 0; }

/* ---------- типографика */
.h1 { font-size: var(--fs-xxl); line-height: 1.15; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.h2 { font-size: var(--fs-xl); line-height: 1.2; font-weight: 700; letter-spacing: -.015em; }
.h3 { font-size: var(--fs-l); line-height: 1.3; font-weight: 600; }
.eyebrow { font-size: var(--fs-xs); letter-spacing: .09em; text-transform: uppercase; color: var(--text3); font-weight: 600; }
.muted { color: var(--text2); }
.small { font-size: var(--fs-s); }
.num { font-variant-numeric: tabular-nums; }
.section { display: flex; align-items: baseline; justify-content: space-between; margin: var(--sp-8) 0 var(--sp-3); }

/* ---------- верхняя панель экрана */
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) max(var(--sp-3), var(--safe-left)) var(--sp-2); background: linear-gradient(var(--bg) 80%, transparent); min-height: 60px; }
.topbar .title { flex: 1; min-width: 0; font-weight: 600; font-size: var(--fs-l); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: var(--touch); height: var(--touch); display: inline-grid; place-items: center; border-radius: 50%; color: var(--text); flex: none; transition: background .15s; }
.icon-btn:active { background: var(--s3); }
.page-title { padding: var(--sp-6) 0 var(--sp-4); }

/* ---------- кнопки */
.btn { min-height: var(--btn-h); padding: 0 var(--sp-6); border-radius: var(--r-m); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); font-weight: 600; font-size: var(--fs-l); background: var(--platinum); color: var(--on-platinum); width: 100%; text-align: center; transition: transform .12s, background .15s, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--s2); color: var(--text); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid transparent; }
.btn.small { min-height: var(--touch); font-size: var(--fs-m); width: auto; padding: 0 var(--sp-5); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.link-btn { color: var(--silver); font-size: var(--fs-s); font-weight: 600; min-height: var(--touch); display: inline-flex; align-items: center; gap: 2px; }

/* ---------- карточки и строки */
.card { background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-l); padding: var(--sp-5); }
.list { background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-l); overflow: hidden; }
.item { display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-height: 64px; padding: var(--sp-3) var(--sp-4); text-align: left; position: relative; }
.item + .item { border-top: 1px solid var(--s3); }
button.item:active, a.item:active { background: var(--s2); }
.item .t { font-weight: 600; font-size: var(--fs-m); line-height: 1.3; }
.item .s { font-size: var(--fs-s); color: var(--text2); line-height: 1.35; margin-top: 1px; }
.item .end { color: var(--text3); font-size: var(--fs-s); text-align: right; white-space: nowrap; display: flex; align-items: center; gap: var(--sp-1); }
.item .lead { width: 28px; color: var(--text3); font-weight: 600; font-size: var(--fs-s); flex: none; text-align: center; }
a.item { color: inherit; text-decoration: none; }

.badge { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--s2); border: 1px solid var(--line); color: var(--text2); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.badges { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

.chips { display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 2px var(--gutter); }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.chip { flex: none; min-height: var(--touch); padding: 0 var(--sp-4); display: inline-flex; align-items: center; gap: 6px; border-radius: 22px; background: var(--s2); border: 1px solid var(--line); color: var(--text2); font-size: var(--fs-m); font-weight: 600; transition: background .15s, color .15s; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--platinum); color: var(--on-platinum); border-color: var(--platinum); }
.chip .ic { width: 18px; height: 18px; }

.seg { display: flex; background: var(--s2); border-radius: var(--r-m); padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 40px; border-radius: 12px; font-weight: 600; font-size: var(--fs-m); color: var(--text2); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--platinum); color: var(--on-platinum); }

.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--s3); border: 1px solid var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text2); transition: transform .2s var(--ease), background .2s; }
.switch[aria-checked="true"] { background: var(--platinum); border-color: var(--platinum); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--on-platinum); }

.input { width: 100%; min-height: var(--btn-h); background: var(--s2); border: 1px solid var(--line); border-radius: var(--r-m); padding: 0 var(--sp-4); color: var(--text); font-size: var(--fs-l); }
.input::placeholder { color: var(--text3); }
.input:focus { outline: none; border-color: var(--silver); }
.search { position: relative; }
.search .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
.search .input { padding-left: 48px; padding-right: 48px; }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }

.stepper { display: flex; align-items: center; gap: var(--sp-3); }
.stepper .val { min-width: 56px; text-align: center; font-weight: 700; font-size: var(--fs-xl); font-variant-numeric: tabular-nums; }
.stepper .icon-btn { background: var(--s2); border: 1px solid var(--line); }

.empty { text-align: center; padding: var(--sp-10) var(--sp-4); display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
.empty .ic { width: 36px; height: 36px; color: var(--text3); }
.empty p { color: var(--text2); max-width: 30ch; }
.note { display: flex; gap: var(--sp-3); padding: var(--sp-4); background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-m); color: var(--text2); font-size: var(--fs-s); line-height: 1.5; }
.note .ic { width: 18px; height: 18px; margin-top: 1px; color: var(--text3); }

/* ---------- нижняя навигация */
#tabbar { display: flex; background: var(--s1); border-top: 1px solid var(--s3); padding: 0 max(var(--sp-1), var(--safe-left)) calc(var(--safe-bottom) + var(--tg-bottom)); flex: none; }
#tabbar button { flex: 1; min-width: 0; height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text3); font-size: 10.5px; letter-spacing: -.01em; font-weight: 600; }
#tabbar button[aria-current="true"] { color: var(--platinum); }
#tabbar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- шторки, диалоги, уведомления */
#layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .62); pointer-events: auto; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 50%; bottom: 0; width: 100%; max-width: var(--maxw); transform: translateX(-50%); background: var(--s1); border-top: 1px solid var(--line); border-radius: var(--r-xl) var(--r-xl) 0 0; max-height: 88%; display: flex; flex-direction: column; pointer-events: auto; animation: up .26s var(--ease); padding-bottom: calc(var(--safe-bottom) + var(--tg-bottom)); }
@keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 0; flex: none; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5) var(--sp-2); flex: none; }
.sheet .body { overflow-y: auto; padding: var(--sp-2) var(--sp-5) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-4); }
.sheet .foot { display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5) var(--sp-4); border-top: 1px solid var(--s3); flex: none; }
.sheet .foot .btn { flex: 1; }
.sheet .foot .btn:first-child:not(:last-child) { flex: 0 0 auto; width: auto; }

.toast { position: absolute; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-bottom) + var(--tg-bottom) + 16px); transform: translateX(-50%); max-width: calc(100% - 40px); background: var(--platinum); color: var(--on-platinum); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: var(--fs-s); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); animation: up .22s var(--ease); pointer-events: none; text-align: center; }
body[data-route="player"] .toast { bottom: calc(var(--safe-bottom) + var(--tg-bottom) + 100px); }

/* ---------- главная */
.greet { padding: var(--sp-6) 0 var(--sp-5); }
.greet .h1 { margin-top: 4px; }
.hero { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: var(--sp-6) var(--sp-5) var(--sp-5); border: 1px solid var(--line); background: radial-gradient(120% 90% at 100% 0%, var(--halo), transparent 60%), linear-gradient(180deg, var(--s2), var(--s1)); display: flex; flex-direction: column; gap: var(--sp-3); }
.hero .name { font-size: 30px; line-height: 1.08; font-weight: 700; letter-spacing: -.025em; text-wrap: balance; }
.hero .time { font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: var(--sp-2); }
.hero .meta { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); color: var(--text2); font-size: var(--fs-s); font-weight: 600; }
.hero .actions { display: flex; gap: var(--sp-3); margin-top: var(--sp-3); }
.hero .actions .btn:first-child { flex: 1; }
.hero .actions .btn.ghost { width: auto; padding: 0 var(--sp-5); font-size: var(--fs-m); }
.resume { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4); border-radius: var(--r-l); background: var(--s2); border: 1px solid var(--line); margin-bottom: var(--sp-4); }
.resume .btn { width: auto; min-height: var(--touch); padding: 0 var(--sp-5); font-size: var(--fs-m); }

.weekcard { display: flex; flex-direction: column; gap: var(--sp-4); }
.dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dot { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text3); font-weight: 600; }
.dot i { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--on-platinum); }
.dot.done i { background: var(--platinum); border-color: var(--platinum); }
.dot.today { color: var(--text); }
.dot.today i { border-color: var(--silver); }
.dot .ic { width: 16px; height: 16px; stroke-width: 2.2; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); border-top: 1px solid var(--s3); padding-top: var(--sp-4); }
.kpi .v { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: var(--fs-xs); color: var(--text3); font-weight: 600; margin-top: 2px; }
.hscroll { display: flex; gap: var(--sp-3); overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 2px var(--gutter); scroll-snap-type: x proximity; }
.hscroll::-webkit-scrollbar { display: none; }
.pcard { flex: none; width: 200px; min-height: 148px; scroll-snap-align: start; border-radius: var(--r-l); background: var(--s1); border: 1px solid var(--s3); padding: var(--sp-4); display: flex; flex-direction: column; justify-content: space-between; gap: var(--sp-3); text-align: left; }
.pcard:active { background: var(--s2); }
.pcard .t { font-weight: 700; font-size: var(--fs-l); line-height: 1.2; letter-spacing: -.01em; }
.pcard .m { color: var(--text2); font-size: var(--fs-s); font-weight: 600; }

/* ---------- программы */
.pcard-wide { display: flex; flex-direction: column; gap: var(--sp-3); width: 100%; text-align: left; background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-l); padding: var(--sp-5); }
.pcard-wide:active { background: var(--s2); }
.pcard-wide .top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); }
.pcard-wide .t { font-size: var(--fs-xl); font-weight: 700; line-height: 1.15; letter-spacing: -.015em; }
.pcard-wide .d { color: var(--text2); font-size: var(--fs-s); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
.fact { background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-m); padding: var(--sp-3) var(--sp-3); min-width: 0; }
.fact .v { font-weight: 700; font-size: var(--fs-l); font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.fact .l { font-size: var(--fs-xs); color: var(--text3); font-weight: 600; margin-top: 2px; }
.sticky-cta { position: sticky; bottom: 0; padding: var(--sp-4) 0 var(--sp-4); background: linear-gradient(transparent, var(--bg) 35%); margin-top: var(--sp-4); }

/* ---------- каталог и карточка упражнения */
.catalog-head { position: sticky; top: 0; z-index: 4; background: var(--bg); padding-bottom: var(--sp-3); }
.count { color: var(--text3); font-size: var(--fs-s); font-weight: 600; margin: var(--sp-3) 0; }
.fav-btn[aria-pressed="true"] { color: var(--platinum); }
.fav-btn[aria-pressed="true"] .ic { fill: currentColor; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
.steps li { counter-increment: s; display: flex; gap: var(--sp-4); line-height: 1.5; }
.steps li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--s2); display: grid; place-items: center; font-size: var(--fs-s); font-weight: 700; color: var(--silver); margin-top: -1px; }
.bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--sp-3); }
.bullets li { position: relative; padding-left: 20px; color: var(--text2); line-height: 1.5; }
.bullets li::before { content: ''; position: absolute; left: 4px; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--text3); }
.block { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-8); }
.block:first-child { margin-top: 0; }
.chipset { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.mchip { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 17px; font-size: var(--fs-s); font-weight: 600; border: 1px solid var(--line); background: var(--s2); color: var(--text2); }
.mchip.primary { background: var(--platinum); border-color: var(--platinum); color: var(--on-platinum); }
.dose-card { display: flex; align-items: center; gap: var(--sp-4); }
.dose-card .big { font-size: 34px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }

/* ---------- конструктор */
.item .mini { display: flex; gap: 2px; }
.item .mini .icon-btn { width: 40px; height: 40px; color: var(--text2); }

/* ---------- экран тренировки */
.player { min-height: 100%; height: 100%; display: flex; flex-direction: column; padding-bottom: calc(var(--safe-bottom) + var(--tg-bottom)); }
#screen:has(.player) { overflow: hidden; }
.p-top { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) max(var(--sp-3), var(--safe-left)) 0; flex: none; }
.p-count { flex: 1; text-align: center; font-size: var(--fs-s); font-weight: 600; color: var(--text2); }
.p-segs { display: flex; gap: 3px; padding: var(--sp-3) max(var(--gutter), var(--safe-left)) 0; flex: none; }
.p-segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--s3); overflow: hidden; position: relative; }
.p-segs i b { position: absolute; inset: 0; background: var(--platinum); transform-origin: left; transform: scaleX(var(--p, 0)); }
.p-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-5) max(var(--gutter), var(--safe-left)) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.p-phase { display: inline-flex; align-self: flex-start; align-items: center; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--s2); font-size: var(--fs-xs); letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--silver); }
.p-phase.work { background: var(--platinum); color: var(--on-platinum); border-color: var(--platinum); }
.p-name { font-size: 28px; line-height: 1.12; font-weight: 700; letter-spacing: -.025em; text-wrap: balance; }
.p-meta { color: var(--text2); font-weight: 600; font-size: var(--fs-m); }
.p-big { font-size: clamp(72px, 27vw, 128px); line-height: 1; font-weight: 700; letter-spacing: -.05em; font-variant-numeric: tabular-nums; margin: var(--sp-3) 0 0; }
.p-big.reps { font-size: clamp(88px, 34vw, 150px); }
.p-sub { color: var(--text2); font-weight: 600; font-size: var(--fs-l); margin-top: -4px; }
.p-bar { height: 6px; background: var(--s3); border-radius: 3px; overflow: hidden; margin-top: var(--sp-3); }
.p-bar b { display: block; height: 100%; background: var(--platinum); transform-origin: left; transform: scaleX(var(--p, 0)); }
.p-extra { align-self: flex-start; }
.p-how { background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-m); padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-2); }
.p-how .start { color: var(--text2); font-size: var(--fs-s); line-height: 1.5; }
.p-how .steps { gap: var(--sp-3); font-size: var(--fs-s); }
.p-how .steps li::before { width: 24px; height: 24px; font-size: var(--fs-xs); }
.p-next { color: var(--text3); font-size: var(--fs-s); font-weight: 600; margin-top: auto; padding-top: var(--sp-3); }
.p-next b { color: var(--text2); font-weight: 600; }
.p-controls { display: grid; grid-template-columns: 56px 1fr 56px; gap: var(--sp-3); align-items: center; padding: var(--sp-3) max(var(--gutter), var(--safe-left)) var(--sp-4); flex: none; border-top: 1px solid var(--s3); background: var(--bg); }
.p-controls .icon-btn { width: 56px; height: 56px; background: var(--s2); border: 1px solid var(--line); }
.p-finish { padding-top: var(--sp-10); align-items: stretch; }
.p-finish .big { font-size: 64px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- прогресс */
.period-nav { display: flex; align-items: center; justify-content: space-between; margin: var(--sp-4) 0 var(--sp-2); }
.period-nav .lbl { font-weight: 600; text-transform: capitalize; }
.period-nav .icon-btn[disabled] { opacity: .3; pointer-events: none; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--text3); font-size: 10px; font-family: var(--font); font-weight: 600; }
.chart .bar { fill: var(--silver); }
.chart .bar.zero { fill: var(--s3); }
.chart .grid { stroke: var(--s3); stroke-width: 1; }
.chart .peak { fill: var(--platinum); }
.day-title { font-size: var(--fs-s); font-weight: 600; color: var(--text3); margin: var(--sp-5) 0 var(--sp-2); text-transform: capitalize; }

/* ---------- профиль */
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--s2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: var(--fs-xl); color: var(--silver); flex: none; }
.group-title { margin: var(--sp-8) 0 var(--sp-3); }
.value { color: var(--text3); font-size: var(--fs-m); }
.prose { color: var(--text2); line-height: 1.6; display: flex; flex-direction: column; gap: var(--sp-3); }

</style>
</head>

12 7.5V12l3 2"/></symbol><symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l.8 12.5h8.4L17 7"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19l1-4L16.5 4.5l3 3L9 18z"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></symbol><symbol id="i-down" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol><symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></symbol><symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01"/></symbol><symbol id="i-reset" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 1 2 5M5 18v-4h4"/></symbol><symbol id="i-sound" viewBox="0 0 24 24"><path d="M5 10v4h3l4 3.5v-11L8 10zM16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10"/></symbol><symbol id="i-vibrate" viewBox="0 0 24 24"><rect x="9" y="5" width="6" height="14" rx="1.5"/><path d="M5.5 9v6M18.5 9v6M3 11v2M21 11v2"/></symbol><symbol id="i-screen" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M9 20h6M12 16v4"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5z"/><path d="M14 3.5V8h4"/></symbol></defs></svg>

<script type="application/json" id="seven-bundle">{"files":{"data/content.ru.json":"{\n \"exercises\": {\n  \"squat\": {\n   \"name\": \"Приседания\",\n   \"aliases\": [\n    \"присед\",\n    \"squat\"\n   ],\n   \"desc\": \"Базовое упражнение для ног и ягодиц.\",\n   \"start\": \"Встаньте прямо, стопы чуть шире плеч, носки слегка развёрнуты наружу. Руки держите перед грудью.\",\n   \"steps\": [\n    \"На вдохе отведите таз назад и вниз, как будто садитесь на стул.\",\n    \"Опускайтесь, пока бёдра не станут примерно параллельны полу — или настолько, насколько позволяет комфортная подвижность.\",\n    \"Колени направляйте по линии носков, спину держите прямой, взгляд вперёд.\",\n    \"На выдохе вытолкните пол пятками и вернитесь в исходное положение.\"\n   ],\n   \"mistakes\": [\n    \"Колени заваливаются внутрь.\",\n    \"Пятки отрываются от пола.\",\n    \"Спина округляется или чрезмерно прогибается в пояснице.\"\n   ],\n   \"tip\": \"Если трудно удерживать равновесие, держитесь за опору или приседайте к стулу.\"\n  },\n  \"sumo_squat\": {\n   \"name\": \"Сумо-приседания\",\n   \"aliases\": [\n    \"сумо\"\n   ],\n   \"desc\": \"Приседания с широкой постановкой ног: больше нагрузки на ягодицы и внутреннюю поверхность бёдер.\",\n   \"start\": \"Встаньте с широкой постановкой ног — заметно шире плеч. Носки развёрнуты наружу на 30–45°.\",\n   \"steps\": [\n    \"Опуститесь вниз, разводя колени в стороны по линии носков.\",\n    \"Корпус вертикален, таз опускается между стопами.\",\n    \"Задержитесь на секунду внизу.\",\n    \"Вернитесь вверх, сжимая ягодицы.\"\n   ],\n   \"mistakes\": [\n    \"Колени уходят внутрь.\",\n    \"Корпус наклоняется вперёд.\",\n    \"Стопы поставлены шире, чем позволяет подвижность.\"\n   ],\n   \"tip\": \"Глубину выбирайте так, чтобы спина оставалась ровной.\"\n  },\n  \"reverse_lunge\": {\n   \"name\": \"Выпады назад\",\n   \"aliases\": [\n    \"выпады\"\n   ],\n   \"desc\": \"Одноопорное упражнение для ног и ягодиц: шаг назад и возврат в исходное положение.\",\n   \"start\": \"Встаньте прямо, стопы на ширине таза, руки на поясе.\",\n   \"steps\": [\n    \"Сделайте широкий шаг назад одной ногой.\",\n    \"Опуститесь, сгибая обе ноги примерно до 90°; заднее колено движется к полу, не касаясь его.\",\n    \"Передняя пятка прижата к полу, корпус прямой.\",\n    \"Оттолкнитесь передней ногой и вернитесь в исходное положение, затем повторите другой ногой.\"\n   ],\n   \"mistakes\": [\n    \"Передняя пятка отрывается от пола.\",\n    \"Корпус сильно наклоняется вперёд.\",\n    \"Шаг слишком короткий — нагрузка уходит в колено.\"\n   ],\n   \"tip\": \"Если трудно удерживать равновесие, держитесь за опору или делайте шаг короче.\"\n  },\n  \"glute_bridge\": {\n   \"name\": \"Ягодичный мост\",\n   \"aliases\": [\n    \"мост\"\n   ],\n   \"desc\": \"Простое упражнение: работают ягодицы и задняя поверхность бёдер.\",\n   \"start\": \"Лягте на спину, ноги согнуты, стопы на ширине таза, пятки близко к ягодицам. Руки вдоль тела ладонями вниз.\",\n   \"steps\": [\n    \"На выдохе поднимите таз, выталкивая пол пятками.\",\n    \"Вверху тело образует прямую линию от плеч до колен; сожмите ягодицы.\",\n    \"Задержитесь на 1–2 секунды.\",\n    \"Плавно опустите таз.\"\n   ],\n   \"mistakes\": [\n    \"Поясница сильно прогибается вверху.\",\n    \"Нагрузка уходит в поясницу, а не в ягодицы.\",\n    \"Колени разъезжаются в стороны.\"\n   ],\n   \"tip\": \"Если поясница напрягается, поднимайте таз ниже. Усложнение — «Ягодичный мост на одной ноге».\"\n  },\n  \"single_leg_bridge\": {\n   \"name\": \"Ягодичный мост на одной ноге\",\n   \"aliases\": [\n    \"мост на одной ноге\"\n   ],\n   \"desc\": \"Усложнённый мост: вся работа достаётся одной ноге, а корпус учится сохранять равновесие.\",\n   \"start\": \"Лягте на спину, одна стопа стоит на полу, вторая нога вытянута вверх или согнута над грудью.\",\n   \"steps\": [\n    \"На выдохе поднимите таз опорной ногой.\",\n    \"Таз остаётся ровным и не заваливается в сторону свободной ноги.\",\n    \"Сожмите ягодицу вверху и плавно опуститесь.\",\n    \"Выполните все повторения, затем смените ногу.\"\n   ],\n   \"mistakes\": [\n    \"Таз перекашивается набок.\",\n    \"Движение рывками.\",\n    \"Отталкивание руками.\"\n   ],\n   \"tip\": \"Если трудно сохранять ровный таз, вернитесь к «Ягодичному мосту».\"\n  },\n  \"calf_raise\": {\n   \"name\": \"Подъёмы на носки\",\n   \"aliases\": [\n    \"икры\"\n   ],\n   \"desc\": \"Простое упражнение для икроножных мышц и устойчивости голеностопа.\",\n   \"start\": \"Встаньте прямо, стопы на ширине таза. При необходимости держитесь за опору.\",\n   \"steps\": [\n    \"Встаньте прямо, стопы на ширине таза; при необходимости держитесь за опору.\",\n    \"Медленно поднимитесь на носки как можно выше.\",\n    \"Задержитесь на секунду вверху.\",\n    \"Плавно опуститесь на пол.\"\n   ],\n   \"mistakes\": [\n    \"Слишком быстрый темп.\",\n    \"Колени сгибаются.\",\n    \"Стопы разворачиваются внутрь или наружу.\"\n   ],\n   \"tip\": \"При необходимости держитесь за опору. Опускайтесь медленно, без рывков.\"\n  },\n  \"wall_sit\": {\n   \"name\": \"Стульчик у стены\",\n   \"aliases\": [\n    \"стульчик\"\n   ],\n   \"desc\": \"Статическое удержание для бёдер: учит выдерживать нагрузку, не двигаясь.\",\n   \"start\": \"Встаньте спиной к стене, стопы на расстоянии шага от неё.\",\n   \"steps\": [\n    \"Скользите спиной по стене вниз, пока колени не согнутся примерно до 90°.\",\n    \"Колени находятся над стопами, спина и таз прижаты к стене.\",\n    \"Руки не опирайте на бёдра — держите их перед собой.\",\n    \"Удерживайте положение, дышите ровно.\"\n   ],\n   \"mistakes\": [\n    \"Колени выходят далеко за носки.\",\n    \"Поясница отрывается от стены.\",\n    \"Задержка дыхания.\"\n   ],\n   \"tip\": \"Если трудно, сядьте не так глубоко (угол в коленях больше 90°) или сократите время.\"\n  },\n  \"donkey_kick\": {\n   \"name\": \"Отведение ноги назад на четвереньках\",\n   \"aliases\": [\n    \"ослиные махи\",\n    \"мах назад\"\n   ],\n   \"desc\": \"Изолированная работа на ягодицы из положения на четвереньках.\",\n   \"start\": \"Встаньте на четвереньки: ладони под плечами, колени под тазом, спина ровная.\",\n   \"steps\": [\n    \"Согнутую в колене ногу поднимите вверх, стопа смотрит в потолок.\",\n    \"Вверху сожмите ягодицу; таз остаётся неподвижным.\",\n    \"Плавно вернитесь, не касаясь коленом пола.\",\n    \"Выполните все повторения, затем смените ногу.\"\n   ],\n   \"mistakes\": [\n    \"Поясница прогибается.\",\n    \"Таз разворачивается в сторону.\",\n    \"Движение рывком.\"\n   ],\n   \"tip\": \"Поднимайте ногу не выше линии таза, чтобы поясница не прогибалась.\"\n  },\n  \"pushup\": {\n   \"name\": \"Отжимания\",\n   \"aliases\": [\n    \"отжимание\"\n   ],\n   \"desc\": \"Классическое упражнение для груди, плеч и трицепса, которое одновременно требует работы корпуса.\",\n   \"start\": \"Упор лёжа: ладони чуть шире плеч, тело — прямая линия от головы до пяток, пресс напряжён.\",\n   \"steps\": [\n    \"Согните руки и опустите грудь к полу; локти направлены назад под углом около 45° к корпусу.\",\n    \"Опуститесь до касания грудью пола или остановитесь в нескольких сантиметрах от него.\",\n    \"Вытолкните себя вверх до выпрямления рук.\",\n    \"Корпус остаётся ровным на протяжении всего повторения.\"\n   ],\n   \"mistakes\": [\n    \"Таз провисает или поднимается «домиком».\",\n    \"Локти разведены строго в стороны.\",\n    \"Неполная амплитуда.\"\n   ],\n   \"tip\": \"Если не получается выполнять повторения с ровным корпусом, перейдите на «Отжимания с колен» или «Отжимания с упором на возвышение».\"\n  },\n  \"incline_pushup\": {\n   \"name\": \"Отжимания с упором на возвышение\",\n   \"aliases\": [\n    \"отжимания от стула\",\n    \"отжимания от стола\"\n   ],\n   \"desc\": \"Облегчённый вариант отжиманий: чем выше опора, тем легче упражнение.\",\n   \"start\": \"Упритесь ладонями в устойчивую опору (стол, диван, подоконник), тело — прямая линия.\",\n   \"steps\": [\n    \"Согните руки и опустите грудь к краю опоры.\",\n    \"Локти направлены назад под углом около 45°.\",\n    \"Вытолкните себя вверх до выпрямления рук.\",\n    \"Держите корпус ровным.\"\n   ],\n   \"mistakes\": [\n    \"Неустойчивая опора.\",\n    \"Провисание таза.\",\n    \"Голова тянется вперёд.\"\n   ],\n   \"tip\": \"Чем выше опора, тем легче упражнение. Выбирайте неподвижную опору.\"\n  },\n  \"knee_pushup\": {\n   \"name\": \"Отжимания с колен\",\n   \"aliases\": [\n    \"отжимания с коленей\"\n   ],\n   \"desc\": \"Облегчённый вариант отжиманий для начала работы с собственным весом.\",\n   \"start\": \"Встаньте в упор на колени: ладони чуть шире плеч, линия от колен до головы прямая.\",\n   \"steps\": [\n    \"Согните руки и опустите грудь к полу.\",\n    \"Локти направлены назад под углом около 45°.\",\n    \"Вытолкните себя вверх до выпрямления рук.\",\n    \"Таз не отставляйте назад — корпус остаётся прямым.\"\n   ],\n   \"mistakes\": [\n    \"Таз отведён назад.\",\n    \"Неполная амплитуда.\",\n    \"Голова опущена вниз.\"\n   ],\n   \"tip\": \"Подложите под колени мягкую подушку или коврик.\"\n  },\n  \"diamond_pushup\": {\n   \"name\": \"Алмазные отжимания\",\n   \"aliases\": [\n    \"узкие отжимания\"\n   ],\n   \"desc\": \"Отжимания с узкой постановкой рук: основной акцент на трицепс.\",\n   \"start\": \"Упор лёжа, кисти под грудью, большие и указательные пальцы образуют ромб.\",\n   \"steps\": [\n    \"Опускайтесь, прижимая локти к корпусу.\",\n    \"Грудь тянется к кистям.\",\n    \"Вытолкните себя вверх, полностью разгибая руки.\",\n    \"При дискомфорте в запястьях поставьте руки чуть шире или выполняйте с колен.\"\n   ],\n   \"mistakes\": [\n    \"Локти расходятся в стороны.\",\n    \"Провисание поясницы.\",\n    \"Кисти развёрнуты неудобно и перегружают запястья.\"\n   ],\n   \"tip\": \"Если трудно или неприятно для запястий, перейдите к «Отжиманиям» или к «Узким отжиманиям с упором на возвышение».\"\n  },\n  \"pike_pushup\": {\n   \"name\": \"Отжимания «горкой»\",\n   \"aliases\": [\n    \"пайк\",\n    \"горка\"\n   ],\n   \"desc\": \"Отжимания с поднятым тазом: смещают нагрузку на плечи.\",\n   \"start\": \"Из упора лёжа поднимите таз вверх: тело образует перевёрнутую букву V, руки и ноги почти прямые.\",\n   \"steps\": [\n    \"Согните руки, опуская макушку к полу между кистями.\",\n    \"Локти направлены назад и немного в стороны.\",\n    \"Вытолкните себя вверх, возвращая таз высоко.\",\n    \"Шея нейтральна, движение контролируемое.\"\n   ],\n   \"mistakes\": [\n    \"Таз опускается — упражнение превращается в обычные отжимания.\",\n    \"Резкий удар головой о пол.\",\n    \"Колени чрезмерно согнуты.\"\n   ],\n   \"tip\": \"Если трудно, уменьшите амплитуду. Не опускайте голову резко: макушка движется к полу плавно.\"\n  },\n  \"chair_dip\": {\n   \"name\": \"Обратные отжимания от стула\",\n   \"aliases\": [\n    \"отжимания на трицепс\",\n    \"дипсы\"\n   ],\n   \"desc\": \"Упражнение для трицепса: опорой служит прочный стул или скамья. В программы по умолчанию не входит.\",\n   \"start\": \"Поставьте прочный стул к стене, чтобы он не скользил и не сдвигался. Сядьте на край, ладони по бокам от таза. Сдвиньте таз вперёд, ноги согнуты.\",\n   \"steps\": [\n    \"Согните руки, опуская таз вниз вдоль стула.\",\n    \"Локти смотрят назад и не расходятся в стороны.\",\n    \"Опуститесь до угла в локтях около 90°.\",\n    \"Вытолкните себя вверх, выпрямляя руки.\"\n   ],\n   \"mistakes\": [\n    \"Плечи уходят к ушам.\",\n    \"Слишком глубокое опускание — лишняя нагрузка на плечевые суставы.\",\n    \"Таз далеко от стула.\"\n   ],\n   \"tip\": \"Опускайтесь неглубоко, плечи держите вдали от ушей. При дискомфорте в плечах остановитесь и выберите «Узкие отжимания с упором на возвышение».\"\n  },\n  \"plank\": {\n   \"name\": \"Планка\",\n   \"aliases\": [\n    \"планка на локтях\"\n   ],\n   \"desc\": \"Удержание положения для мышц кора: учит стабилизировать корпус.\",\n   \"start\": \"Упор на предплечья: локти под плечами, тело — прямая линия от головы до пяток.\",\n   \"steps\": [\n    \"Напрягите пресс и ягодицы.\",\n    \"Не позволяйте тазу провисать или подниматься.\",\n    \"Смотрите в пол, шея продолжает линию спины.\",\n    \"Дышите ровно, не задерживая дыхание.\"\n   ],\n   \"mistakes\": [\n    \"Поясница провисает.\",\n    \"Таз слишком высоко поднят.\",\n    \"Плечи уходят к ушам.\"\n   ],\n   \"tip\": \"Если трудно, выполняйте упражнение с колен или с упором на устойчивое возвышение. Заканчивайте подход, когда техника ухудшается.\"\n  },\n  \"side_plank\": {\n   \"name\": \"Боковая планка\",\n   \"aliases\": [\n    \"планка на боку\"\n   ],\n   \"desc\": \"Удержание на боку для косых мышц живота и стабилизаторов корпуса.\",\n   \"start\": \"Лягте на бок, упор на предплечье: локоть под плечом, ноги вместе.\",\n   \"steps\": [\n    \"Лягте на бок, упор на предплечье: локоть под плечом, ноги вместе.\",\n    \"Поднимите таз, чтобы тело стало прямой линией от головы до стоп.\",\n    \"Свободную руку поставьте на пояс или вытяните вверх; дышите ровно.\",\n    \"Удерживайте положение заданное время, затем смените сторону.\"\n   ],\n   \"mistakes\": [\n    \"Таз опускается.\",\n    \"Корпус наклоняется вперёд или назад.\",\n    \"Плечо проваливается.\"\n   ],\n   \"tip\": \"Облегчение: согните колени и опирайтесь на колено и предплечье.\"\n  },\n  \"crunch\": {\n   \"name\": \"Скручивания\",\n   \"aliases\": [\n    \"пресс\"\n   ],\n   \"desc\": \"Базовое упражнение для прямой мышцы живота.\",\n   \"start\": \"Лягте на спину, колени согнуты, стопы на полу. Руки у висков, локти в стороны.\",\n   \"steps\": [\n    \"На выдохе оторвите лопатки от пола, подтягивая рёбра к тазу.\",\n    \"Поясница остаётся прижатой к полу.\",\n    \"Задержитесь на секунду вверху.\",\n    \"Плавно опуститесь.\"\n   ],\n   \"mistakes\": [\n    \"Тянете голову руками за шею.\",\n    \"Поднимаете весь корпус, а не только лопатки.\",\n    \"Рывки.\"\n   ],\n   \"tip\": \"Если устаёт шея, скрестите руки на груди и смотрите в потолок.\"\n  },\n  \"bicycle_crunch\": {\n   \"name\": \"Велосипед\",\n   \"aliases\": [\n    \"скручивания велосипед\"\n   ],\n   \"desc\": \"Динамические скручивания с поворотом: прямая и косые мышцы живота.\",\n   \"start\": \"Лягте на спину, руки у висков, ноги подняты и согнуты.\",\n   \"steps\": [\n    \"Тяните правый локоть к левому колену, выпрямляя правую ногу.\",\n    \"Затем смените стороны, как при езде на велосипеде.\",\n    \"Движение плавное, поясница прижата к полу.\",\n    \"Считайте каждое касание за одно повторение.\"\n   ],\n   \"mistakes\": [\n    \"Тянете шею руками.\",\n    \"Слишком быстрый темп.\",\n    \"Поясница отрывается от пола.\"\n   ],\n   \"tip\": \"Если трудно, замедлите темп или выполняйте обычные «Скручивания».\"\n  },\n  \"leg_raise\": {\n   \"name\": \"Подъём ног лёжа\",\n   \"aliases\": [\n    \"подъём ног\"\n   ],\n   \"desc\": \"Упражнение для нижней части пресса и сгибателей бедра.\",\n   \"start\": \"Лягте на спину, руки вдоль тела (можно под ягодицы), ноги вытянуты.\",\n   \"steps\": [\n    \"Поднимите прямые ноги вверх до вертикали.\",\n    \"Плавно опускайте, не касаясь пола пятками.\",\n    \"Поясницу удерживайте прижатой к полу.\",\n    \"Если трудно, сгибайте колени.\"\n   ],\n   \"mistakes\": [\n    \"Поясница отрывается от пола и прогибается.\",\n    \"Рывки и раскачивание.\",\n    \"Ноги падают вниз без контроля.\"\n   ],\n   \"tip\": \"Если поясница отрывается от пола, сгибайте колени или опускайте ноги не так низко.\"\n  },\n  \"dead_bug\": {\n   \"name\": \"Мёртвый жук\",\n   \"aliases\": [\n    \"жук\"\n   ],\n   \"desc\": \"Упражнение для мышц кора: поясница прижата к полу, пока двигаются руки и ноги.\",\n   \"start\": \"Лягте на спину, руки вытянуты к потолку, ноги согнуты в коленях, бёдра вертикально.\",\n   \"steps\": [\n    \"Медленно опустите противоположные руку и ногу, вытягивая их и не касаясь пола.\",\n    \"Поясница прижата к ерите «Конькобежец шагом».\"\n  },\n  \"superman\": {\n   \"name\": \"Супермен\",\n   \"aliases\": [\n    \"супермен\"\n   ],\n   \"desc\": \"Упражнение для разгибателей спины и ягодиц лёжа на животе. Лёгкая работа без внешнего сопротивления, не заменяет тягу.\",\n   \"start\": \"Лягте на живот, руки вытянуты вперёд, ноги вместе.\",\n   \"steps\": [\n    \"Одновременно поднимите руки, грудь и ноги от пола.\",\n    \"Задержитесь на 1–2 секунды вверху.\",\n    \"Шея нейтральна, взгляд в пол.\",\n    \"Плавно опуститесь.\"\n   ],\n   \"mistakes\": [\n    \"Запрокидывание головы.\",\n    \"Резкий выгиб поясницы.\",\n    \"Рывки.\"\n   ],\n   \"tip\": \"Поднимайтесь невысоко: важна работа мышц, а не максимальный прогиб. Если поясница напрягается, поднимайте только руки или только ноги.\"\n  },\n  \"reverse_snow_angel\": {\n   \"name\": \"Обратный «снежный ангел»\",\n   \"aliases\": [\n    \"снежный ангел\"\n   ],\n   \"desc\": \"Упражнение для верхней части спины и задних пучков дельтовидных мышц. Лёгкая работа для осанки, не заменяет тягу с сопротивлением.\",\n   \"start\": \"Лягте на живот, ноги вместе, руки вдоль тела ладонями вниз. Приподнимите грудь от пола.\",\n   \"steps\": [\n    \"Ведите прямые руки дугой вперёд над головой.\",\n    \"Затем так же вернитесь к бёдрам.\",\n    \"Лопатки сведены, грудь приподнята, шея нейтральна.\",\n    \"Движение плавное.\"\n   ],\n   \"mistakes\": [\n    \"Поясница прогибается.\",\n    \"Руки касаются пола.\",\n    \"Слишком быстрый темп.\"\n   ],\n   \"tip\": \"Двигайтесь плавно и без груза. Для тяги с сопротивлением используйте «Тягу рюкзака в наклоне».\"\n  },\n  \"bird_dog\": {\n   \"name\": \"Птица-собака\",\n   \"aliases\": [\n    \"бёрд-дог\"\n   ],\n   \"desc\": \"Упражнение на баланс и стабилизацию корпуса.\",\n   \"start\": \"Встаньте на четвереньки: ладони под плечами, колени под тазом, спина ровная.\",\n   \"steps\": [\n    \"Вытяните вперёд правую руку и назад левую ногу.\",\n    \"Тело — одна линия, таз и плечи неп  держитесь за опору.\",\n   \"steps\": [\n    \"Согните одну ногу и возьмите стопу рукой.\",\n    \"Подтяните пятку к ягодице, колени рядом.\",\n    \"Корпус прямой, таз слегка подкручен вперёд.\",\n    \"Смените ногу.\"\n   ],\n   \"mistakes\": [\n    \"Колено уходит далеко вперёд.\",\n    \"Поясница прогибается.\",\n    \"Потеря равновесия без опоры.\"\n   ]\n  },\n  \"chest_stretch\": {\n   \"name\": \"Растяжка груди у стены\",\n   \"aliases\": [\n    \"растяжка грудных\"\n   ],\n   \"desc\": \"Растяжка мышц груди и передней части плеча.\",\n   \"start\": \"Встаньте у стены или в дверном проёме, ладонь и предплечье прижаты к опоре, локоть на уровне плеча.\",\n   \"steps\": [\n    \"Сделайте небольшой шаг вперёд, разворачивая корпус от опоры.\",\n    \"Почувствуйте растяжение в груди и передней части плеча.\",\n    \"Не поднимайте плечи к ушам.\",\n    \"Выполните на обе стороны.\"\n   ],\n   \"mistakes\": [\n    \"Плечо уходит к уху.\",\n    \"Слишком сильный разворот до боли.\",\n    \"Поясница прогибается.\"\n   ]\n  },\n  \"figure_four\": {\n   \"name\": \"Растяжка «четвёрка» лёжа\",\n   \"aliases\": [\n    \"четвёрка\",\n    \"растяжка ягодиц\"\n   ],\n   \"desc\": \"Растяжка ягодичных мышц и наружной поверхности бедра лёжа на спине.\",\n   \"start\": \"Лягте на спину, ноги согнуты, стопы на полу.\",\n   \"steps\": [\n    \"Положите лодыжку одной ноги на колено другой.\",\n    \"Обхватите бедро опорной ноги и потяните к груди.\",\n    \"Почувствуйте растяжение в ягодице.\",\n    \"Смените ногу.\"\n   ],\n   \"mistakes\": [\n    \"Таз отрывается от пола.\",\n    \"Рывки.\",\n    \"Давление на колено вместо бедра.\"\n   ]\n  },\n  \"hip_flexor_stretch\": {\n   \"name\": \"Растяжка сгибателей бедра\",\n   \"aliases\": [\n    \"выпад на колене\"\n   ],\n   \"desc\": \"Растяжка передней поверхности бедра в выпаде на колене.\",\n   \"start\": \"Встаньте на одно колено (подложите мягкое), другая нога впереди, колено над стопой.\",\n   \"steps\": [\n    \"Подкрутите таз вперёд-вверх, напрягая ягодицу задней ноги.\",\n    \"Корпус прямой, слегка сдвиньтесь вперёд.\",\n    \"Почувствуйте растяжение в передней части бедра задней ноги.\",\n    \"Смените ногу.\"\n   ],\n   \"mistakes\": [\n    \"Поясница прогибается.\",\n    \"Колено передней ноги уходит за носок.\",\n    \"Рывки.\"\n   ]\n  },\n  \"step_up\": {\n   \"name\": \"Подъёмы на стул\",\n   \"aliases\": [\n    \"степ\",\n    \"подъём на ступеньку\"\n   ],\n   \"desc\": \"Подъём на низкую, устойчивую опору: работают ноги и ягодицы. Ноги чередуются в одном подходе.\",\n   \"start\": \"Встаньте лицом к низкой, устойчивой, нескользящей опоре: ступенька, прочная низкая скамья или устойчивый невысокий стул, прижатый к стене. Высота — примерно до колена или ниже, чем ниже, тем проще. Стопы на ширине таза.\",\n   \"steps\": [\n    \"Поставьте одну стопу на сиденье целиком.\",\n    \"Оттолкнитесь этой ногой и поднимитесь, выпрямляя колено и таз.\",\n    \"Приставьте вторую ногу или коснитесь ею сиденья и так же спокойно спуститесь вниз.\",\n    \"Чередуйте ведущую ногу.\"\n   ],\n   \"mistakes\": [\n    \"Опора высокая, шаткая или скользкая.\",\n    \"Нога стоит на опоре только носком.\",\n    \"Колено заваливается внутрь.\",\n    \"Спешка и прыжки вместо контролируемого движения.\"\n   ],\n   \"tip\": \"Не используйте высокий, неустойчивый стул, стул на колёсиках или скользкую поверхность. Если подходящей низкой опоры нет, замените упражнение приседаниями.\"\n  },\n  \"run_in_place\": {\n   \"name\": \"Бег на месте\",\n   \"aliases\": [\n    \"бег\"\n   ],\n   \"desc\": \"Лёгкий бег на месте в удобном темпе.\",\n   \"start\": \"Встаньте прямо, стопы на ширине таза, руки согнуты в локтях.\",\n   \"steps\": [\n    \"Бегите на месте, поочерёдно отрывая стопы от пола.\",\n    \"Руки работают, как при беге, плечи расслаблены.\",\n    \"Приземляйтесь мягко, на переднюю часть стопы.\",\n    \"Дышите ровно и выберите темп, который можно держать весь отрезок.\"\n   ],\n   \"mistakes\": [\n    \"Жёсткое приземление на пятки.\",\n    \"Плечи подняты и напряжены.\",\n    \"Слишком быстрый темп в начале.\"\n   ],\n   \"tip\": \"Если бег не подходит, выберите «Марш на месте с подъёмом колен».\"\n  },\n  \"alternating_lunge\": {\n   \"name\": \"Выпады с чередованием ног\",\n   \"aliases\": [\n    \"выпады вперёд\",\n    \"выпады\"\n   ],\n   \"desc\": \"Выпады, при которых ноги чередуются в одном подходе. Значение повторений — общее число на обе ноги.\",\n   \"start\": \"Встаньте прямо, стопы на ширине таза, руки на поясе.\",\n   \"steps\": [\n    \"Сделайте шаг вперёд и опуститесь, сгибая обе ноги примерно до 90°.\",\n    \"Переднее колено направлено по линии носка, корпус прямой.\",\n    \"Оттолкнитесь передней ногой и вернитесь в исходное положение.\",\n    \"Повторите другой ногой и продолжайте чередовать.\"\n   ],\n   \"mistakes\": [\n    \"Корпус наклоняется вперёд.\",\n    \"Колено заваливается внутрь.\",\n    \"Шаг слишком короткий или слишком длинный.\"\n   ],\n   \"tip\": \"Если трудно сохранять равновесие, держитесь за опору.\"\n  },\n  \"pushup_rotation\": {\n   \"name\": \"Отжимания с поворотом\",\n   \"aliases\": [\n    \"отжимание с ротацией\"\n   ],\n   \"desc\": \"Отжимание, после которого корпус поворачивается в сторону с поднятой рукой. Стороны чередуются.\",\n   \"start\": \"Упор лёжа: ладони под плечами, тело — прямая линия от головы до пяток.\",\n   \"steps\": [\n    \"Согните руки и опустите грудь к полу.\",\n    \"Выпрямите руки и, перенося вес на одну руку, поверните корпус в сторону.\",\n    \"Поднимите свободную руку вверх, взгляд следует за рукой.\",\n    \"Вернитесь в упор лёжа и повторите в другую сторону.\"\n   ],\n   \"mistakes\": [\n    \"Таз провисает.\",\n    \"Поворот выполняется рывком.\",\n    \"Опорная рука смещается далеко от линии плеча.\"\n   ],\n   \"tip\": \"Облегчить упражнение можно, выполняя его с колен.\"\n  },\n  \"step_jack\": {\n   \"name\": \"Шаги «звёздочка»\",\n   \"aliases\": [\n    \"звёздочка без прыжков\",\n    \"степ джек\",\n    \"jack\"\n   ],\n   \"desc\": \"Вариант «звёздочки» без прыжков: шаги в стороны с подъёмом рук. Одна стопа всегда стоит на полу.\",\n   \"start\": \"Встаньте прямо, стопы вместе, руки вдоль тела.\",\n   \"steps\": [\n    \"Шагните правой ногой в сторону и одновременно поднимите руки через стороны над головой.\",\n    \"Приставьте левую ногу к правой и опустите руки.\",\n    \"Шагните в другую сторону и повторите, чередуя стороны.\",\n    \"Дышите ровно; темп выбирайте такой, чтобы сохранять контроль.\"\n   ],\n   \"mistakes\": [\n    \"Шаг слишком широкий — теряется равновесие.\",\n    \"Руки не поднимаются выше плеч.\",\n    \"Корпус наклоняется в сторону шага.\"\n   ],\n   \"tip\": \"Подходит вместо «звёздочки», если прыжки вам не подходят. Когда движение станет привычным, можно перейти к прыжковому варианту.\"\n  },\n  \"march_in_place\": {\n   \"name\": \"Марш на месте с подъёмом колен\",\n   \"aliases\": [\n    \"марш\",\n    \"ходьба на месте\",\n    \"шаги на месте\"\n   ],\n   \"desc\": \"Шаги на месте с активной работой рук и бёдер, без прыжков и бега.\",\n   \"start\": \"Встаньте прямо, стопы на ширине таза, руки согнуты в локтях.\",\n   \"steps\": [\n    \"Поочерёдно поднимайте колени примерно до уровня таза; одна стопа всегда стоит на полу.\",\n    \"Руки двигаются навстречу ногам, как при быстрой ходьбе.\",\n    \"Корпус прямой, плечи расслаблены, стопы опускайте мягко.\",\n    \"Ускоряйтесь постепенно, пока дыхание остаётся ровным.\"\n   ],\n   \"mistakes\": [\n    \"Корпус откидывается назад.\",\n    \"Шаги слишком короткие — упражнение превращается в ходьбу на месте.\",\n    \"Стопы опускаются на пятки с ударом.\"\n   ],\n   \"tip\": \"Вариант без ударной нагрузки: подходит вместо «Бега с высоким подъёмом колен» и «Бега на месте».\"\n  },\n  \"step_skater\": {\n   \"name\": \"Конькобежец шагом\",\n   \"aliases\": [\n    \"скейтер без прыжков\",\n    \"конькобежец без прыжка\"\n   ],\n   \"desc\": \"Боковые шаги с переносом веса и отведением ноги назад, без прыжков.\",\n   \"start\": \"Встаньте прямо, стопы на ширине таза, колени слегка согнуты.\",\n   \"steps\": [\n    \"Сделайте широкий шаг вправо и перенесите вес на правую ногу, колено слегка согнуто.\",\n    \"Левую ногу отведите назад и вбок за правую; носок едва касается пола.\",\n    \"Руки качнитесь навстречу ногам для равновесия.\",\n    \"Одним плавным шагом перенесите вес на левую ногу и повторите в другую сторону.\"\n   ],\n   \"mistakes\": [\n    \"Колено опорной ноги заваливается внутрь.\",\n    \"Корпус сильно наклоняется вперёд.\",\n    \"Темп слишком высокий — теряется контроль.\"\n   ],\n   \"tip\": \"Вариант без прыжка: подходит вместо «Конькобежца».\"\n  },\n  \"burpee_step\": {\n   \"name\": \"Бёрпи без прыжка и отжимания\",\n   \"aliases\": [\n    \"берпи без прыжка\",\n    \"бёрпи шагом\",\n    \"бёрпи облегчённые\"\n   ],\n   \"desc\": \"Облегчённый вариант бёрпи: приседание, упор лёжа и подъём без отжимания и без прыжка.\",\n   \"start\": \"Встаньте прямо, стопы на ширине плеч.\",\n   \"steps\": [\n    \"Присядьте и поставьте ладони на пол перед собой.\",\n    \"По одной отведите ноги назад в упор лёжа; тело — прямая линия.\",\n    \"По одной верните ноги к рукам.\",\n    \"Выпрямитесь и поднимите руки вверх без прыжка.\"\n   ],\n   \"mistakes\": [\n    \"Поясница провисает в упоре.\",\n    \"Ноги возвращаются далеко от рук.\",\n    \"Темп слишком высокий — техника теряется.\"\n   ],\n   \"tip\": \"Если упор лёжа удерживать трудно, поставьте ладони на устойчивую опору повыше (стол, прочное сиденье). Когда движение станет уверенным, можно перейти к «Бёрпи».\"\n  },\n  \"close_grip_incline_pushup\": {\n   \"name\": \"Узкие отжимания с упором на возвышение\",\n   \"aliases\": [\n    \"отжимания на трицепс\",\n    \"узкие отжимания от стола\",\n    \"щадящие для трицепса\"\n   ],\n   \"desc\": \"Отжимания узким хватом от устойчивой опоры: основная нагрузка на трицепс и грудь. Более щадящая замена обратным отжиманиям от стула.\",\n   \"start\": \"Упритесь ладонями в устойчивую неподвижную опору (стол или стул, прижатый к стене): кисти под грудью, чуть уже плеч. Тело — прямая линия от головы до пяток.\",\n   \"steps\": [\n    \"Согните руки и опустите грудь к краю опоры; локти прижаты к корпусу и направлены назад.\",\n    \"Остановитесь, не доходя до опоры несколько сантиметров.\",\n    \"Вытолкните себя вверх до выпрямления рук.\",\n    \"Корпус ровный, пресс напряжён, шея продолжает линию спины.\"\n   ],\n   \"mistakes\": [\n    \"Опора неустойчива или скользит.\",\n    \"Локти расходятся в стороны.\",\n    \"Таз провисает или поднимается «домиком».\"\n   ],\n   \"tip\": \"Чем выше опора, тем легче упражнение; чем ниже, тем тяжелее. Если нагрузка на запястья неприятна, поставьте кисти чуть шире.\"\n  },\n  \"backpack_row\": {\n   \"name\": \"Тяга рюкзака в наклоне\",\n   \"aliases\": [\n    \"тяга рюкзака\",\n    \"тяга с рюкзаком\",\n    \"тяга в наклоне\",\n    \"гребля\"\n   ],\n   \"desc\": \"Тяговое упражнение для спины с минимальным инвентарём: рюкзак с грузом тянут к животу. Используется как упражнение с сопротивлением.\",\n   \"start\": \"Положите в рюкзак книги или бутылки с водой так, чтобы лямки и ручка держались надёжно. Встаньте, стопы на ширине таза, колени слегка согнуты, возьмите рюкзак двумя руками.\",\n   \"steps\": [\n    \"Наклоните корпус вперёд от тазобедренных суставов; спина прямая, взгляд в пол перед собой. Рюкзак висит на прямых руках.\",\n    \"Подтяните рюкзак к низу живота, сводя лопатки; локти идут назад вдоль корпуса.\",\n    \"Задержитесь на секунду и медленно опустите рюкзак.\",\n    \"Угол наклона корпуса не меняйте в течение подхода.\"\n   ],\n   \"mistakes\": [\n    \"Спина округляется.\",\n    \"Рюкзак тянется рывком, корпус раскачивается.\",\n    \"Груз слишком тяжёлый — техника нарушается.\"\n   ],\n   \"tip\": \"Вес подбирайте так, чтобы все повторения выполнялись с ровной спиной. Движения без груза (например, «снежный ангел») — лёгкая работа и не заменяют тягу с сопротивлением.\"\n  }\n },\n \"programs\": {\n  \"full_start\": {\n   \"name\": \"Всё тело: старт\",\n   \"desc\": \"Мягкое начало для тех, кто возвращается к тренировкам: базовые движения на всё тело без инвентаря, без прыжков.\",\n   \"note\": \"Тяговых упражнений здесь нет: для тяги с сопротивлением нужен рюкзак с грузом («Тяга рюкзака в наклоне» — в программах «Сила дома» и «Верх тела»). Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше в упражнениях на время); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется только один параметр; при плохой технике или усталости вернитесь на неделю назад. В приложении неделя не переключается автоматически: свои значения можно задать в «Мои программы».\"\n  },\n  \"strength_home\": {\n   \"name\": \"Сила дома\",\n   \"desc\": \"Силовая тренировка с собственным весом: ноги, грудь, плечи, спина (тяга рюкзака) и корпус. Жимовые и тяговые упражнения чередуются.\",\n   \"note\": \"Для тяги нужен рюкзак с грузом (книги, бутылки с водой). Без груза полноценной тяги нет, и упражнения на спину без сопротивления её не заменяют. Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше в упражнениях на время); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется только один параметр; при плохой технике или усталости вернитесь на неделю назад. В приложении неделя не переключается автоматически: свои значения можно задать в «Мои программы».\"\n  },\n  \"hiit\": {\n   \"name\": \"Выносливость: интервалы\",\n   \"desc\": \"Кардио-интервалы без оборудования. Работайте в своём темпе; прыжковые упражнения можно заменить вариантами без прыжков (ссылки «Проще» на карточках упражнений).\",\n   \"note\": \"Варианты без ударной нагрузки: «Шаги „звёздочка“», «Конькобежец шагом», «Марш на месте с подъёмом колен», «Бёрпи без прыжка и отжимания». Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — 30 с работы и 30 с отдыха; неделя 2 — работа 40 с при том же отдыхе; неделя 3 — отдых 20 с; неделя 4 — третий подход в двух упражнениях. За неделю меняется один параметр; при усталости вернитесь на неделю назад.\"\n  },\n  \"abs_core\": {\n   \"name\": \"Пресс и кор\",\n   \"desc\": \"Упражнения на кор: стабилизация, антиротация и немного скручиваний и подъёмов ног без перегрузки однотипными движениями.\",\n   \"note\": \"Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше в упражнениях на время); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется только один параметр; при плохой технике или усталости вернитесь на неделю назад. В приложении неделя не переключается автоматически: свои значения можно задать в «Мои программы».\"\n  },\n  \"legs_glutes\": {\n   \"name\": \"Ноги и ягодицы\",\n   \"desc\": \"Приседания, выпады и мосты для нижней части тела: сначала квадрицепсы и ягодицы, затем икры.\",\n   \"note\": \"Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше в упражнениях на время); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется только один параметр; при плохой технике или усталости вернитесь на неделю назад. В приложении неделя не переключается автоматически: свои значения можно задать в «Мои программы».\"\n  },\n  \"upper_body\": {\n   \"name\": \"Верх тела\",\n   \"desc\": \"Грудь, плечи, трицепс и спина с собственным весом и рюкзаком. Жимовые движения чередуются с тягой, тяге отведено больше подходов.\",\n   \"note\": \"Для тяги нужен рюкзак с грузом. «Обратный „снежный ангел“» — лёгкая работа для осанки, он не заменяет тягу с сопротивлением. Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше в упражнениях на время); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется только один параметр; при плохой технике или усталости вернитесь на неделю назад. В приложении неделя не переключается автоматически: свои значения можно задать в «Мои программы».\"\n  },\n  \"mobility_morning\": {\n   \"name\": \"Утренняя мобильность\",\n   \"desc\": \"Плавная разминка суставов и позвоночника: сначала стоя, затем на полу.\",\n   \"note\": \"Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — один проход; неделя 2 — удержания на 10 с дольше, амплитуда в пределах комфорта; неделя 3 — второй проход по упражнениям, которые даются труднее; неделя 4 — те же значения, внимание на плавность и дыхание.\"\n  },\n  \"stretch_after\": {\n   \"name\": \"Растяжка после тренировки\",\n   \"desc\": \"Спокойная растяжка основных мышечных групп: сначала стоя, затем на полу.\",\n   \"note\": \"Растяжение должно быть комфортным, без боли. Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — один проход; неделя 2 — удержания на 10 с дольше; неделя 3 — второй проход по тем упражнениям, где ощущаете большую скованность; неделя 4 — те же значения.\"\n  },\n  \"circuit_12\": {\n   \"name\": \"Круг: 12 упражнений\",\n   \"desc\": \"Круг из 12 упражнений: по 30 секунд работы и 10 секунд отдыха между ними. Составлен по мотивам идеи из статьи Klika и Jordan (2013); это адаптация, а не воспроизведение опубликованного протокола. Результат не гарантируется.\",\n   \"note\": \"Источник идеи: Klika B., Jordan C. High-intensity circuit training using body weight: maximum results with minimal investment. ACSM’s Health & Fitness Journal, 2013, 17(3):8–13. Библиографические данные и состав упражнений сверены по вторичному источнику; саму статью автор приложения не читал. В описании источника обратные отжимания на стуле, здесь они заменены на узкие отжимания с упором на возвышение; один круг. Упражнения идут на время, счётчика повторений нет: старайтесь выполнять аккуратные повторения в своём темпе. Ориентир на 4 недели (редакционный, результат не гарантируется): недели 1–2 — один круг, внимание на технику; неделя 3 — второй круг через 2 минуты отдыха; неделя 4 — второй круг через 90 секунд отдыха.\"\n  }\n }\n}","data/exercises.json":"[\n {\n  \"id\": \"squat\",\n  \"categories\": [\n   \"legs\",\n   \"glutes\",\n   \"fullbody\"\n  ],\n  \"muscles\": {\n   \"primary\": [\n    \"quads\",\n    \"glutes\"\n   ],\n   \"secondary\": [\n    \"hamstrings\",\n    \"abs\"\n   ]\n  },\n  \"level\": \"beginner\",\n  \"mode\": \"reps\",\n  \"sides\": \"none\",\n  \"switchSec\": 0,\n  \"review\": \"draft\",\n  \"access\": \"free\",\n  \"equipment\": [\n   \"none\"\n  ],\n  \"defaults\": {\n   \"sets\": 3,\n   \"reps\": 15,\n   \"rest\": 45\n  },\n  \"harder\": \"sumo_squat\"\n },\n {\n  \"id\": \"sumo_squat\",\n  \"categories\": [\n   \"legs\",\n   \"glutes\"\n  ],\n  \"muscles\": {\n   \"primary\": [\n    \"glutes\",\n    \"adductors\",\n    \"quads\"\n   ],\n   \"secondary\": [\n    \"hamstrings\"\n   ]\n  },\n  \"level\": \"beginner\",\n  \"mode\": \"reps\",\n  \"sides\": \"none\",\n  \"switchSec\": 0,\n  \"review\": \"draft\",\n  \"access\": \"free\",\n  \"equipment\": [\n   \"none\"\n  ],\n  \"defaults\": {\n   \"sets\": 3,\n   \"reps\": 12,\n   \"rest\": 45\n  },\n  \"easier\": \"squat\"\n },\n {\n  \"id\": \"reverse_lunge\",\n  \"categories\": [\n   \"legs\",\n   \"glutes\"\n  ],\n  \"muscles\": {\n   \"primary\": [\n    \"quads\",\n    \"glutes\"\n   ],\n   \"second
