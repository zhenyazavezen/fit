<script type="application/json" id="app-bundle">{"files":{"data/cards.json":"{ \"squat\": \"assets/cards/squat.jpg\" }\n","data/content.ru.json":"{\n  \"exercises\": {\n    \"squat\": {\n      \"name\": \"Приседания\",\n      \"aliases\": [\n        \"присед\",\n        \"squat\"\n      ],\n      \"desc\": \"Базовое приседание с собственным весом: нагружает бёдра и ягодицы.\",\n      \"start\": \"Встаньте, стопы немного шире таза, носки чуть развёрнуты в стороны. Сложите ладони перед грудью или скрестите руки.\",\n      \"steps\": [\n        \"Начинайте с таза: сначала отведите его назад, затем сгибайте колени.\",\n        \"Опускайтесь на комфортную глубину; хорошо, если бёдра доходят почти до параллели с полом.\",\n        \"Колени двигаются в ту же сторону, куда смотрят носки, и не сходятся внутрь; вес приходится на всю стопу.\",\n        \"Поднимайтесь, надавливая на пол всей стопой, и в конце движения выпрямите таз.\"\n      ],\n      \"mistakes\": [\n        \"Колени сходятся друг к другу при подъёме.\",\n        \"Пятки отрываются, вес уходит на носки.\",\n        \"Спина округляется внизу или сильно выгибается в пояснице.\"\n      ],\n      \"tip\": \"Если трудно удерживать равновесие, держитесь за опору или приседайте к стулу.\"\n    },\n    \"sumo_squat\": {\n      \"name\": \"Сумо-приседания\",\n      \"aliases\": [\n        \"сумо\"\n      ],\n      \"desc\": \"Приседания с широкой постановкой ног: больше нагрузки на ягодицы и внутреннюю поверхность бёдер.\",\n      \"start\": \"Встаньте с широкой постановкой ног — заметно шире плеч. Носки развёрнуты наружу на 30–45°.\",\n      \"steps\": [\n        \"Опуститесь вниз, разводя колени в стороны по линии носков.\",\n        \"Корпус вертикален, таз опускается между стопами.\",\n        \"Задержитесь на секунду внизу.\",\n        \"Вернитесь вверх, сжимая ягодицы.\"\n      ],\n      \"mistakes\": [\n        \"Колени уходят внутрь.\",\n        \"Корпус наклоняется вперёд.\",\n        \"Стопы поставлены шире, чем позволяет подвижность.\"\n      ],\n      \"tip\": \"Глубину выбирайте так, чтобы спина оставалась ровной.\"\n    },\n    \"reverse_lunge\": {\n      \"name\": \"Выпады назад\",\n      \"aliases\": [\n        \"выпады\"\n      ],\n      \"desc\": \"Одноопорное упражнение для ног и ягодиц: шаг назад и возврат в исходное положение.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза, руки на поясе.\",\n      \"steps\": [\n        \"Сделайте широкий шаг назад одной ногой.\",\n        \"Опуститесь, сгибая обе ноги примерно до 90°; заднее колено движется к полу, не касаясь его.\",\n        \"Передняя пятка прижата к полу, корпус прямой.\",\n        \"Оттолкнитесь передней ногой и вернитесь в исходное положение, затем повторите другой ногой.\"\n      ],\n      \"mistakes\": [\n        \"Передняя пятка отрывается от пола.\",\n        \"Корпус сильно наклоняется вперёд.\",\n        \"Шаг слишком короткий — нагрузка уходит в колено.\"\n      ],\n      \"tip\": \"Если трудно удерживать равновесие, держитесь за опору или делайте шаг короче.\"\n    },\n    \"glute_bridge\": {\n      \"name\": \"Ягодичный мост\",\n      \"aliases\": [\n        \"мост\"\n      ],\n      \"desc\": \"Подъём таза лёжа на спине: работают ягодицы и задняя поверхность бёдер.\",\n      \"start\": \"Лягте на спину, согните колени и поставьте стопы на пол на ширине таза, недалеко от ягодиц. Руки лежат вдоль тела.\",\n      \"steps\": [\n        \"На выдохе поднимайте таз, отталкиваясь стопами от пола.\",\n        \"Поднимитесь до положения, когда плечи, таз и колени образуют одну наклонную линию.\",\n        \"Вверху сильно напрягите ягодицы и задержитесь на секунду-другую, не выгибая поясницу.\",\n        \"Опускайте таз медленно, пока не коснётесь пола.\"\n      ],\n      \"mistakes\": [\n        \"Таз поднят слишком высоко, поясница выгнута.\",\n        \"Усилие ощущается в пояснице или задней части бедра, а не в ягодицах.\",\n        \"Колени сводятся или разъезжаются.\"\n      ],\n      \"tip\": \"Если поясница напрягается, поднимайте таз ниже. Усложнение — «Ягодичный мост на одной ноге».\"\n    },\n    \"single_leg_bridge\": {\n      \"name\": \"Ягодичный мост на одной ноге\",\n      \"aliases\": [\n        \"мост на одной ноге\"\n      ],\n      \"desc\": \"Подъём таза на одной ноге: нагрузка на ягодицу опорной ноги и работа мышц для устойчивости таза.\",\n      \"start\": \"Лягте на спину. Одну стопу поставьте на пол, колено согнуто. Другую ногу поднимите и удерживайте согнутой над грудью.\",\n      \"steps\": [\n        \"Опираясь на стопу опорной ноги, поднимайте таз.\",\n        \"Следите, чтобы обе стороны таза оставались на одном уровне.\",\n        \"Вверху на секунду напрягите ягодицу опорной ноги.\",\n        \"Опускайтесь плавно. Все повторения делайте на одной ноге, затем поменяйте ногу.\"\n      ],\n      \"mistakes\": [\n        \"Таз заваливается в сторону поднятой ноги.\",\n        \"Подъём выполняется рывком.\",\n        \"Вы помогаете себе, упираясь руками в пол.\"\n      ],\n      \"tip\": \"Если трудно сохранять ровный таз, вернитесь к «Ягодичному мосту».\"\n    },\n    \"calf_raise\": {\n      \"name\": \"Подъёмы на носки\",\n      \"aliases\": [\n        \"икры\"\n      ],\n      \"desc\": \"Простое упражнение для икроножных мышц и устойчивости голеностопа.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза. При необходимости держитесь за опору.\",\n      \"steps\": [\n        \"Встаньте прямо, стопы на ширине таза; при необходимости держитесь за опору.\",\n        \"Медленно поднимитесь на носки как можно выше.\",\n        \"Задержитесь на секунду вверху.\",\n        \"Плавно опуститесь на пол.\"\n      ],\n      \"mistakes\": [\n        \"Слишком быстрый темп.\",\n        \"Колени сгибаются.\",\n        \"Стопы разворачиваются внутрь или наружу.\"\n      ],\n      \"tip\": \"При необходимости держитесь за опору. Опускайтесь медленно, без рывков.\"\n    },\n    \"wall_sit\": {\n      \"name\": \"Стульчик у стены\",\n      \"aliases\": [\n        \"стульчик\"\n      ],\n      \"desc\": \"Статическое удержание для бёдер: учит выдерживать нагрузку, не двигаясь.\",\n      \"start\": \"Встаньте спиной к стене, стопы на расстоянии шага от неё.\",\n      \"steps\": [\n        \"Скользите спиной по стене вниз, пока колени не согнутся примерно до 90°.\",\n        \"Колени находятся над стопами, спина и таз прижаты к стене.\",\n        \"Руки не опирайте на бёдра — держите их перед собой.\",\n        \"Удерживайте положение, дышите ровно.\"\n      ],\n      \"mistakes\": [\n        \"Колени выходят далеко за носки.\",\n        \"Поясница отрывается от стены.\",\n        \"Задержка дыхания.\"\n      ],\n      \"tip\": \"Если трудно, сядьте не так глубоко (угол в коленях больше 90°) или сократите время.\"\n    },\n    \"pushup\": {\n      \"name\": \"Отжимания\",\n      \"aliases\": [\n        \"отжимание\"\n      ],\n      \"desc\": \"Классическое упражнение для груди, плеч и трицепса, которое одновременно требует работы корпуса.\",\n      \"start\": \"Упор лёжа: ладони чуть шире плеч, тело — прямая линия от головы до пяток, пресс напряжён.\",\n      \"steps\": [\n        \"Согните руки и опустите грудь к полу; локти направлены назад под углом около 45° к корпусу.\",\n        \"Опуститесь до касания грудью пола или остановитесь в нескольких сантиметрах от него.\",\n        \"Вытолкните себя вверх до выпрямления рук.\",\n        \"Корпус остаётся ровным на протяжении всего повторения.\"\n      ],\n      \"mistakes\": [\n        \"Таз провисает или поднимается «домиком».\",\n        \"Локти разведены строго в стороны.\",\n        \"Неполная амплитуда.\"\n      ],\n      \"tip\": \"Если не получается выполнять повторения с ровным корпусом, перейдите на «Отжимания с колен» или «Отжимания с упором на возвышение».\"\n    },\n    \"incline_pushup\": {\n      \"name\": \"Отжимания с упором на возвышение\",\n      \"aliases\": [\n        \"отжимания от стула\",\n        \"отжимания от стола\"\n      ],\n      \"desc\": \"Облегчённый вариант отжиманий от опоры: чем выше опора, тем легче.\",\n      \"start\": \"Поставьте ладони на край устойчивой опоры (стол, прочная тумба) чуть шире плеч и отойдите назад, чтобы тело стало прямой наклонной линией.\",\n      \"steps\": [\n        \"Напрягите пресс и ягодицы, чтобы корпус не провисал.\",\n        \"Сгибая руки, опускайте грудь к краю опоры; локти идут назад и немного в стороны, не растопыриваясь.\",\n        \"Остановитесь, когда грудь окажется около опоры.\",\n        \"Выпрямите руки, отталкивая опору от себя.\"\n      ],\n      \"mistakes\": [\n        \"Опора неустойчива или скользит.\",\n        \"Таз провисает.\",\n        \"Голова вытягивается вперёд.\"\n      ],\n      \"tip\": \"Чем выше опора, тем легче упражнение. Выбирайте неподвижную опору.\"\n    },\n    \"knee_pushup\": {\n      \"name\": \"Отжимания с колен\",\n      \"aliases\": [\n        \"отжимания с коленей\"\n      ],\n      \"desc\": \"Облегчённый вариант отжиманий для начала работы с собственным весом.\",\n      \"start\": \"Встаньте в упор на колени: ладони чуть шире плеч, линия от колен до головы прямая.\",\n      \"steps\": [\n        \"Согните руки и опустите грудь к полу.\",\n        \"Локти направлены назад под углом около 45°.\",\n        \"Вытолкните себя вверх до выпрямления рук.\",\n        \"Таз не отставляйте назад — корпус остаётся прямым.\"\n      ],\n      \"mistakes\": [\n        \"Таз отведён назад.\",\n        \"Неполная амплитуда.\",\n        \"Голова опущена вниз.\"\n      ],\n      \"tip\": \"Подложите под колени мягкую подушку или коврик.\"\n    },\n    \"pike_pushup\": {\n      \"name\": \"Отжимания «горкой»\",\n      \"aliases\": [\n        \"пайк\",\n        \"горка\"\n      ],\n      \"desc\": \"Отжимания с поднятым тазом: смещают нагрузку на плечи.\",\n      \"start\": \"Из упора лёжа поднимите таз вверх: тело образует перевёрнутую букву V, руки и ноги почти прямые.\",\n      \"steps\": [\n        \"Согните руки, опуская макушку к полу между кистями.\",\n        \"Локти направлены назад и немного в стороны.\",\n        \"Вытолкните себя вверх, возвращая таз высоко.\",\n        \"Шея нейтральна, движение контролируемое.\"\n      ],\n      \"mistakes\": [\n        \"Таз опускается — упражнение превращается в обычные отжимания.\",\n        \"Резкий удар головой о пол.\",\n        \"Колени чрезмерно согнуты.\"\n      ],\n      \"tip\": \"Если трудно, уменьшите амплитуду. Не опускайте голову резко: макушка движется к полу плавно.\"\n    },\n    \"plank\": {\n      \"name\": \"Планка\",\n      \"aliases\": [\n        \"планка на локтях\"\n      ],\n      \"desc\": \"Удержание положения для мышц кора: учит стабилизировать корпус.\",\n      \"start\": \"Упор на предплечья: локти под плечами, тело — прямая линия от головы до пяток.\",\n      \"steps\": [\n        \"Напрягите пресс и ягодицы.\",\n        \"Не позволяйте тазу провисать или подниматься.\",\n        \"Смотрите в пол, шея продолжает линию спины.\",\n        \"Дышите ровно, не задерживая дыхание.\"\n      ],\n      \"mistakes\": [\n        \"Поясница провисает.\",\n        \"Таз слишком высоко поднят.\",\n        \"Плечи уходят к ушам.\"\n      ],\n      \"tip\": \"Если трудно, выполняйте упражнение с колен или с упором на устойчивое возвышение. Заканчивайте подход, когда техника ухудшается.\"\n    },\n    \"side_plank\": {\n      \"name\": \"Боковая планка\",\n      \"aliases\": [\n        \"планка на боку\"\n      ],\n      \"desc\": \"Удержание на боку для косых мышц живота и стабилизаторов корпуса.\",\n      \"start\": \"Лягте на бок, вытянув ноги и сложив их вместе. Согнутую руку опустите на пол для упора на предплечье.\",\n      \"steps\": [\n        \"Поставьте локоть точно под плечо и оттолкнитесь предплечьем от пола, отодвигая плечо от уха.\",\n        \"Поднимите таз, пока тело не вытянется в одну прямую линию.\",\n        \"Верхнюю руку положите на пояс или потяните вверх; дышите ровно.\",\n        \"Удерживайте положение заданное время, затем повторите на другом боку.\"\n      ],\n      \"mistakes\": [\n        \"Таз опускается или уходит назад.\",\n        \"Корпус заваливается вперёд или назад.\",\n        \"Плечо проваливается к уху.\"\n      ],\n      \"tip\": \"Облегчение: согните колени и опирайтесь на колено и предплечье.\"\n    },\n    \"crunch\": {\n      \"name\": \"Скручивания\",\n      \"aliases\": [\n        \"пресс\"\n      ],\n      \"desc\": \"Базовое упражнение для прямой мышцы живота.\",\n      \"start\": \"Лягте на спину, колени согнуты, стопы на полу. Руки у висков, локти в стороны.\",\n      \"steps\": [\n        \"На выдохе оторвите лопатки от пола, подтягивая рёбра к тазу.\",\n        \"Поясница остаётся прижатой к полу.\",\n        \"Задержитесь на секунду вверху.\",\n        \"Плавно опуститесь.\"\n      ],\n      \"mistakes\": [\n        \"Тянете голову руками за шею.\",\n        \"Поднимаете весь корпус, а не только лопатки.\",\n        \"Рывки.\"\n      ],\n      \"tip\": \"Если устаёт шея, скрестите руки на груди и смотрите в потолок.\"\n    },\n    \"leg_raise\": {\n      \"name\": \"Подъём ног лёжа\",\n      \"aliases\": [\n        \"подъём ног\"\n      ],\n      \"desc\": \"Упражнение для нижней части пресса и сгибателей бедра.\",\n      \"start\": \"Лягте на спину, руки вдоль тела, колени согнуты — так начинайте по умолчанию; прямые ноги — только для продвинутых.\",\n      \"steps\": [\n        \"Поднимите прямые ноги вверх до вертикали.\",\n        \"Плавно опускайте, не касаясь пола пятками.\",\n        \"Поясницу удерживайте прижатой к полу.\",\n        \"Если трудно, сгибайте колени.\"\n      ],\n      \"mistakes\": [\n        \"Поясница отрывается от пола и прогибается.\",\n        \"Рывки и раскачивание.\",\n        \"Ноги падают вниз без контроля.\"\n      ],\n      \"tip\": \"Если поясница отрывается от пола, сгибайте колени или опускайте ноги не так низко.\"\n    },\n    \"dead_bug\": {\n      \"name\": \"Мёртвый жук\",\n      \"aliases\": [\n        \"жук\"\n      ],\n      \"desc\": \"Упражнение для кора: поясница остаётся неподвижной, пока руки и ноги двигаются по очереди.\",\n      \"start\": \"Лягте на спину, вытяните руки вертикально вверх. Поднимите согнутые ноги так, чтобы голени были параллельны полу.\",\n      \"steps\": [\n        \"Слегка напрягите пресс и сохраняйте поясницу прижатой к полу на протяжении всего упражнения.\",\n        \"На выдохе одновременно опустите одну руку за голову и вытяните противоположную ногу.\",\n        \"Остановитесь, не касаясь пола, и верните руку и ногу в исходное положение.\",\n        \"Повторите с другой руки и ноги, двигаясь медленно.\"\n      ],\n      \"mistakes\": [\n        \"Поясница отрывается от пола и выгибается.\",\n        \"Руки и ноги быстро падают вниз.\",\n        \"Задержка дыхания.\"\n      ],\n      \"tip\": \"Облегчение: двигайте только ногами, руки оставьте вытянутыми к потолку.\"\n    },\n    \"mountain_climber\": {\n      \"name\": \"Скалолаз\",\n      \"aliases\": [\n        \"альпинист\"\n      ],\n      \"desc\": \"Кардио-упражнение в упоре лёжа: пульс растёт, пресс и плечи работают.\",\n      \"start\": \"Упор лёжа на прямых руках, тело — прямая линия.\",\n      \"steps\": [\n        \"Поочерёдно подтягивайте колени к груди.\",\n        \"Плечи над кистями, таз не поднимается.\",\n        \"Темп — от умеренного до быстрого.\",\n        \"Дышите ровно.\"\n      ],\n      \"mistakes\": [\n        \"Таз слишком высоко.\",\n        \"Руки уходят вперёд от плеч.\",\n        \"Жёсткие удары стопами об пол.\"\n      ],\n      \"tip\": \"Облегчение: поставьте ладони на устойчивую опору повыше и двигайтесь спокойнее.\"\n    },\n    \"jumping_jack\": {\n      \"name\": \"Прыжки «звёздочка»\",\n      \"aliases\": [\n        \"джампинг джек\",\n        \"звёздочка\"\n      ],\n      \"desc\": \"Простое кардио-упражнение для разогрева и повышения пульса.\",\n      \"start\": \"Встаньте прямо, стопы вместе, руки вдоль тела.\",\n      \"steps\": [\n        \"Прыжком разведите ноги шире плеч и одновременно поднимите руки над головой.\",\n        \"Прыжком вернитесь в исходное положение.\",\n        \"Приземляйтесь мягко, на переднюю часть стопы.\",\n        \"Облегчённый вариант: шагайте в стороны без прыжка.\"\n      ],\n      \"mistakes\": [\n        \"Жёсткое приземление на прямые ноги.\",\n        \"Руки не выпрямлены.\",\n        \"Слишком быстрый темп в начале.\"\n      ],\n      \"tip\": \"Если прыжки вам не подходят, выберите «Шаги „звёздочка“».\"\n    },\n    \"high_knees\": {\n      \"name\": \"Бег с высоким подъёмом колен\",\n      \"aliases\": [\n        \"высокие колени\"\n      ],\n      \"desc\": \"Бег на месте с активной работой бёдер и рук.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза.\",\n      \"steps\": [\n        \"Бегите на месте, поднимая колени до уровня таза.\",\n        \"Руки работают, как при беге.\",\n        \"Корпус прямой, приземление на переднюю часть стопы.\",\n        \"Темп комфортный, но активный.\"\n      ],\n      \"mistakes\": [\n        \"Колени поднимаются низко.\",\n        \"Корпус откидывается назад.\",\n        \"Приземление на пятки.\"\n      ],\n      \"tip\": \"Если прыжки и бег не подходят, выберите «Марш на месте с подъёмом колен».\"\n    },\n    \"burpee\": {\n      \"name\": \"Бёрпи\",\n      \"aliases\": [\n        \"берпи\"\n      ],\n      \"desc\": \"Комплексное упражнение на всё тело: приседание, упор лёжа, отжимание и прыжок. Высокая сложность.\",\n      \"start\": \"Встаньте прямо, стопы на ширине плеч.\",\n      \"steps\": [\n        \"Присядьте и поставьте ладони на пол.\",\n        \"Отведите ноги назад в упор лёжа.\",\n        \"Верните ноги к рукам (при желании добавьте отжимание).\",\n        \"Выпрыгните вверх, поднимая руки над головой.\"\n      ],\n      \"mistakes\": [\n        \"Поясница провисает в упоре.\",\n        \"Жёсткое приземление.\",\n        \"Темп, при котором теряется техника.\"\n      ],\n      \"tip\": \"Если упражнение пока слишком сложное, выберите «Бёрпи без прыжка и отжимания».\"\n    },\n    \"skater\": {\n      \"name\": \"Конькобежец\",\n      \"aliases\": [\n        \"скейтер\"\n      ],\n      \"desc\": \"Боковые прыжки с переносом веса: ягодицы, бёдра и координация.\",\n      \"start\": \"Встаньте на одну ногу, корпус слегка наклонён, вторая нога отведена назад.\",\n      \"steps\": [\n        \"Оттолкнитесь в сторону и приземлитесь на другую ногу.\",\n        \"Свободная нога уходит назад-вбок, руки помогают держать равновесие.\",\n        \"Колено опорной ноги согнуто, корпус слегка наклонён.\",\n        \"Двигайтесь плавно, как конькобежец.\"\n      ],\n      \"mistakes\": [\n        \"Колено заваливается внутрь.\",\n        \"Приземление на прямую ногу.\",\n        \"Слишком большая амплитуда без контроля.\"\n      ],\n      \"tip\": \"Если прыжки вам не подходят, выберите «Конькобежец шагом».\"\n    },\n    \"bird_dog\": {\n      \"name\": \"Птица-собака\",\n      \"aliases\": [\n        \"бёрд-дог\"\n      ],\n      \"desc\": \"Упражнение на баланс и стабильность корпуса: рука и противоположная нога вытягиваются по очереди.\",\n      \"start\": \"Встаньте на четвереньки: ладони под плечами, колени под тазом. Спина нейтральна, взгляд направлен в пол.\",\n      \"steps\": [\n        \"Слегка напрягите пресс, чтобы корпус не провисал.\",\n        \"Вытяните одну руку вперёд, а противоположную ногу назад: тянитесь пальцами и пяткой в разные стороны.\",\n        \"Поднимайте руку и ногу только до линии корпуса, не раскачивая таз и плечи.\",\n        \"Верните руку и ногу на пол и повторите с другой диагональю.\"\n      ],\n      \"mistakes\": [\n        \"Поясница прогибается.\",\n        \"Таз перекашивается набок.\",\n        \"Нога поднимается выше линии корпуса.\"\n      ],\n      \"tip\": \"Облегчение: поднимайте только руку или только ногу.\"\n    },\n    \"plank_taps\": {\n      \"name\": \"Планка с касанием плеч\",\n      \"aliases\": [\n        \"касания плеч\"\n      ],\n      \"desc\": \"Планка на прямых руках с поочерёдными касаниями плеча: учит удерживать корпус неподвижным.\",\n      \"start\": \"Примите упор лёжа на прямых руках: кисти под плечами, стопы поставлены шире, чем в обычной планке, тело прямое.\",\n      \"steps\": [\n        \"Напрягите пресс и ягодицы, чтобы корпус был жёстким.\",\n        \"Перенесите вес на одну руку и коснитесь ладонью другой руки противоположного плеча.\",\n        \"Верните руку на пол и повторите другой рукой.\",\n        \"Следите, чтобы таз не раскачивался из стороны в сторону.\"\n      ],\n      \"mistakes\": [\n        \"Таз раскачивается при каждом касании.\",\n        \"Таз поднимается вверх.\",\n        \"Стопы стоят слишком узко, поэтому трудно сохранять равновесие.\"\n      ],\n      \"tip\": \"Если таз раскачивается, поставьте стопы шире или вернитесь к «Планке».\"\n    },\n    \"arm_circles\": {\n      \"name\": \"Круги руками\",\n      \"aliases\": [\n        \"вращения руками\"\n      ],\n      \"desc\": \"Небольшие круги руками для разогрева плечевых суставов.\",\n      \"start\": \"Встаньте ровно, разведите прямые руки в стороны до уровня плеч, ладони смотрят вниз.\",\n      \"steps\": [\n        \"Рисуйте руками небольшие круги, не сгибая локти.\",\n        \"Через 15 секунд поменяйте направление вращения.\",\n        \"Плечи расслаблены и опущены, шея свободна.\",\n        \"Постепенно увеличивайте размер кругов.\"\n      ],\n      \"mistakes\": [\n        \"Плечи подтягиваются к ушам.\",\n        \"Движения резкие.\",\n        \"Слишком большие круги с первых секунд.\"\n      ]\n    },\n    \"cat_cow\": {\n      \"name\": \"Кошка–корова\",\n      \"aliases\": [\n        \"кошка\",\n        \"кот-корова\"\n      ],\n      \"desc\": \"Плавные движения позвоночника в ритме дыхания.\",\n      \"start\": \"Опуститесь на четвереньки: запястья под плечами, колени под тазом, шея продолжает линию спины.\",\n      \"steps\": [\n        \"На вдохе мягко прогните спину вниз: живот опускается, грудь и таз тянутся вверх, взгляд поднимается вперёд.\",\n        \"На выдохе выгните спину вверх дугой и подтяните подбородок к груди.\",\n        \"Переходите из одного положения в другое плавно, подстраивая темп под дыхание.\",\n        \"Двигайтесь только в комфортном диапазоне, без боли.\"\n      ],\n      \"mistakes\": [\n        \"Слишком быстрый темп.\",\n        \"Локти сгибаются.\",\n        \"Резкий прогиб в пояснице.\"\n      ],\n      \"tip\": \"Двигайтесь в комфортной амплитуде и в ритме дыхания.\"\n    },\n    \"lunge_twist\": {\n      \"name\": \"Выпад с поворотом корпуса\",\n      \"aliases\": [\n        \"выпад с поворотом\"\n      ],\n      \"desc\": \"Динамическая разминка: открывает тазобедренные суставы и грудной отдел.\",\n      \"start\": \"Встаньте прямо и сделайте широкий выпад вперёд, руки перед грудью.\",\n      \"steps\": [\n        \"Опустите заднее колено к полу.\",\n        \"Поверните корпус в сторону передней ноги, раскройте руку.\",\n        \"Вернитесь в центр.\",\n        \"Выпрямитесь в исходное положение и смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Передняя пятка отрывается.\",\n        \"Поворот только руками, а не корпусом.\",\n        \"Колено заваливается внутрь.\"\n      ]\n    },\n    \"thoracic_rotation\": {\n      \"name\": \"Вращения грудного отдела\",\n      \"aliases\": [\n        \"ротация грудного отдела\",\n        \"открывание груди\"\n      ],\n      \"desc\": \"Мобилизация верхней части спины и плеч в положении на четвереньках.\",\n      \"start\": \"Встаньте на четвереньки, одна ладонь за головой.\",\n      \"steps\": [\n        \"На выдохе поверните корпус и локоть вниз — к опорной руке.\",\n        \"На вдохе раскройте грудь, поднимая локоть к потолку.\",\n        \"Таз остаётся неподвижным.\",\n        \"Выполните повторения и смените руку.\"\n      ],\n      \"mistakes\": [\n        \"Поворот за счёт поясницы.\",\n        \"Таз сдвигается назад.\",\n        \"Слишком резкие движения.\"\n      ]\n    },\n    \"child_pose\": {\n      \"name\": \"Поза ребёнка\",\n      \"aliases\": [\n        \"ребёнок\"\n      ],\n      \"desc\": \"Спокойная растяжка спины и бёдер.\",\n      \"start\": \"Встаньте на четвереньки, большие пальцы стоп соприкасаются, колени чуть шире таза.\",\n      \"steps\": [\n        \"Отведите таз назад к пяткам.\",\n        \"Вытяните руки вперёд, лоб опустите на пол.\",\n        \"Дышите медленно и глубоко.\",\n        \"Если колени дискомфортны, подложите подушку между бёдрами и икрами.\"\n      ],\n      \"mistakes\": [\n        \"Рывок назад.\",\n        \"Напряжение в плечах.\",\n        \"Задержка дыхания.\"\n      ]\n    },\n    \"hamstring_stretch\": {\n      \"name\": \"Растяжка задней поверхности бедра\",\n      \"aliases\": [\n        \"растяжка бедра сзади\"\n      ],\n      \"desc\": \"Мягкая растяжка мышц задней поверхности бедра сидя.\",\n      \"start\": \"Сядьте на пол, одну ногу выпрямите, другую согните стопой к бедру.\",\n      \"steps\": [\n        \"Наклонитесь вперёд от бёдер к выпрямленной ноге.\",\n        \"Спина длинная, не округляйте её сильно.\",\n        \"Растяжение должно быть комфортным, без боли.\",\n        \"Смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Сильное округление спины.\",\n        \"Рывки.\",\n        \"Растяжение до боли.\"\n      ],\n      \"tip\": \"Растяжение должно быть комфортным; при боли уменьшите наклон.\"\n    },\n    \"quad_stretch\": {\n      \"name\": \"Растяжка квадрицепса стоя\",\n      \"aliases\": [\n        \"растяжка передней поверхности бедра\"\n      ],\n      \"desc\": \"Растяжка передней поверхности бедра в положении стоя.\",\n      \"start\": \"Встаньте прямо, при необходимости держитесь за опору.\",\n      \"steps\": [\n        \"Согните одну ногу и возьмите стопу рукой.\",\n        \"Подтяните пятку к ягодице, колени рядом.\",\n        \"Корпус прямой, таз слегка подкручен вперёд.\",\n        \"Смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Колено уходит далеко вперёд.\",\n        \"Поясница прогибается.\",\n        \"Потеря равновесия без опоры.\"\n      ]\n    },\n    \"chest_stretch\": {\n      \"name\": \"Растяжка груди у стены\",\n      \"aliases\": [\n        \"растяжка грудных\"\n      ],\n      \"desc\": \"Растяжка мышц груди и передней части плеча.\",\n      \"start\": \"Встаньте у стены или в дверном проёме, ладонь и предплечье прижаты к опоре, локоть на уровне плеча.\",\n      \"steps\": [\n        \"Сделайте небольшой шаг вперёд, разворачивая корпус от опоры.\",\n        \"Почувствуйте растяжение в груди и передней части плеча.\",\n        \"Не поднимайте плечи к ушам.\",\n        \"Выполните на обе стороны.\"\n      ],\n      \"mistakes\": [\n        \"Плечо уходит к уху.\",\n        \"Слишком сильный разворот до боли.\",\n        \"Поясница прогибается.\"\n      ]\n    },\n    \"figure_four\": {\n      \"name\": \"Растяжка «четвёрка» лёжа\",\n      \"aliases\": [\n        \"четвёрка\",\n        \"растяжка ягодиц\"\n      ],\n      \"desc\": \"Растяжка ягодичных мышц и наружной поверхности бедра лёжа на спине.\",\n      \"start\": \"Лягте на спину, ноги согнуты, стопы на полу.\",\n      \"steps\": [\n        \"Положите лодыжку одной ноги на колено другой.\",\n        \"Обхватите бедро опорной ноги и потяните к груди.\",\n        \"Почувствуйте растяжение в ягодице.\",\n        \"Смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Таз отрывается от пола.\",\n        \"Рывки.\",\n        \"Давление на колено вместо бедра.\"\n      ]\n    },\n    \"hip_flexor_stretch\": {\n      \"name\": \"Растяжка сгибателей бедра\",\n      \"aliases\": [\n        \"выпад на колене\"\n      ],\n      \"desc\": \"Растяжка передней поверхности бедра в выпаде на колене.\",\n      \"start\": \"Встаньте на одно колено (подложите мягкое), другая нога впереди, колено над стопой.\",\n      \"steps\": [\n        \"Подкрутите таз вперёд-вверх, напрягая ягодицу задней ноги.\",\n        \"Корпус прямой, слегка сдвиньтесь вперёд.\",\n        \"Почувствуйте растяжение в передней части бедра задней ноги.\",\n        \"Смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Поясница прогибается.\",\n        \"Колено передней ноги уходит за носок.\",\n        \"Рывки.\"\n      ]\n    },\n    \"step_up\": {\n      \"name\": \"Подъёмы на стул\",\n      \"aliases\": [\n        \"степ\",\n        \"подъём на ступеньку\"\n      ],\n      \"desc\": \"Подъём на низкую, устойчивую опору: работают ноги и ягодицы. Ноги чередуются в одном подходе.\",\n      \"start\": \"Встаньте лицом к низкой, устойчивой, нескользящей опоре: ступенька, прочная низкая скамья или устойчивый невысокий стул, прижатый к стене. Высота — примерно до колена или ниже, чем ниже, тем проще. Стопы на ширине таза.\",\n      \"steps\": [\n        \"Поставьте одну ногу на опору полностью, не оставляя пятку в воздухе.\",\n        \"Выпрямите ногу на опоре и поднимитесь; вторую ногу подтяните к первой, почти не помогая себе ею.\",\n        \"Спускайтесь медленно, сначала опуская на пол свободную ногу.\",\n        \"Чередуйте ногу, с которой начинаете подъём.\"\n      ],\n      \"mistakes\": [\n        \"Опора высокая, шаткая или скользкая.\",\n        \"Нога стоит на опоре только носком.\",\n        \"Колено заваливается внутрь.\",\n        \"Спешка и прыжки вместо контролируемого движения.\"\n      ],\n      \"tip\": \"Не используйте высокий, неустойчивый стул, стул на колёсиках или скользкую поверхность. Если подходящей низкой опоры нет, замените упражнение приседаниями.\"\n    },\n    \"pushup_rotation\": {\n      \"name\": \"Отжимания с поворотом\",\n      \"aliases\": [\n        \"отжимание с ротацией\"\n      ],\n      \"desc\": \"Отжимание, после которого корпус поворачивается в сторону с поднятой рукой. Стороны чередуются.\",\n      \"start\": \"Упор лёжа: ладони под плечами, тело — прямая линия от головы до пяток.\",\n      \"steps\": [\n        \"Согните руки и опустите грудь к полу.\",\n        \"Выпрямите руки и, перенося вес на одну руку, поверните корпус в сторону.\",\n        \"Поднимите свободную руку вверх, взгляд следует за рукой.\",\n        \"Вернитесь в упор лёжа и повторите в другую сторону.\"\n      ],\n      \"mistakes\": [\n        \"Таз провисает.\",\n        \"Поворот выполняется рывком.\",\n        \"Опорная рука смещается далеко от линии плеча.\"\n      ],\n      \"tip\": \"Облегчить упражнение можно, выполняя его с колен.\"\n    },\n    \"step_jack\": {\n      \"name\": \"Шаги «звёздочка»\",\n      \"aliases\": [\n        \"звёздочка без прыжков\",\n        \"степ джек\",\n        \"jack\"\n      ],\n      \"desc\": \"Вариант «звёздочки» без прыжков: шаги в стороны с подъёмом рук. Одна стопа всегда стоит на полу.\",\n      \"start\": \"Встаньте прямо, стопы вместе, руки вдоль тела.\",\n      \"steps\": [\n        \"Шагните правой ногой в сторону и одновременно поднимите руки через стороны над головой.\",\n        \"Приставьте левую ногу к правой и опустите руки.\",\n        \"Шагните в другую сторону и повторите, чередуя стороны.\",\n        \"Дышите ровно; темп выбирайте такой, чтобы сохранять контроль.\"\n      ],\n      \"mistakes\": [\n        \"Шаг слишком широкий — теряется равновесие.\",\n        \"Руки не поднимаются выше плеч.\",\n        \"Корпус наклоняется в сторону шага.\"\n      ],\n      \"tip\": \"Подходит вместо «звёздочки», если прыжки вам не подходят. Когда движение станет привычным, можно перейти к прыжковому варианту.\"\n    },\n    \"march_in_place\": {\n      \"name\": \"Марш на месте с подъёмом колен\",\n      \"aliases\": [\n        \"марш\",\n        \"ходьба на месте\",\n        \"шаги на месте\"\n      ],\n      \"desc\": \"Шаги на месте с активной работой рук и бёдер, без прыжков и бега.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза, руки согнуты в локтях.\",\n      \"steps\": [\n        \"Поочерёдно поднимайте колени примерно до уровня таза; одна стопа всегда стоит на полу.\",\n        \"Руки двигаются навстречу ногам, как при быстрой ходьбе.\",\n        \"Корпус прямой, плечи расслаблены, стопы опускайте мягко.\",\n        \"Ускоряйтесь постепенно, пока дыхание остаётся ровным.\"\n      ],\n      \"mistakes\": [\n        \"Корпус откидывается назад.\",\n        \"Шаги слишком короткие — упражнение превращается в ходьбу на месте.\",\n        \"Стопы опускаются на пятки с ударом.\"\n      ],\n      \"tip\": \"Вариант без ударной нагрузки: подходит вместо «Бега с высоким подъёмом колен» и «Бега на месте».\"\n    },\n    \"step_skater\": {\n      \"name\": \"Конькобежец шагом\",\n      \"aliases\": [\n        \"скейтер без прыжков\",\n        \"конькобежец без прыжка\"\n      ],\n      \"desc\": \"Боковые шаги с переносом веса и отведением ноги назад, без прыжков.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза, колени слегка согнуты.\",\n      \"steps\": [\n        \"Сделайте широкий шаг вправо и перенесите вес на правую ногу, колено слегка согнуто.\",\n        \"Левую ногу отведите назад и вбок за правую; носок едва касается пола.\",\n        \"Руки качнитесь навстречу ногам для равновесия.\",\n        \"Одним плавным шагом перенесите вес на левую ногу и повторите в другую сторону.\"\n      ],\n      \"mistakes\": [\n        \"Колено опорной ноги заваливается внутрь.\",\n        \"Корпус сильно наклоняется вперёд.\",\n        \"Темп слишком высокий — теряется контроль.\"\n      ],\n      \"tip\": \"Вариант без прыжка: подходит вместо «Конькобежца».\"\n    },\n    \"burpee_step\": {\n      \"name\": \"Бёрпи без прыжка и отжимания\",\n      \"aliases\": [\n        \"берпи без прыжка\",\n        \"бёрпи шагом\",\n        \"бёрпи облегчённые\"\n      ],\n      \"desc\": \"Облегчённый вариант бёрпи: приседание, упор лёжа и подъём без отжимания и без прыжка.\",\n      \"start\": \"Встаньте прямо, стопы на ширине плеч.\",\n      \"steps\": [\n        \"Присядьте и поставьте ладони на пол перед собой.\",\n        \"По одной отведите ноги назад в упор лёжа; тело — прямая линия.\",\n        \"По одной верните ноги к рукам.\",\n        \"Выпрямитесь и поднимите руки вверх без прыжка.\"\n      ],\n      \"mistakes\": [\n        \"Поясница провисает в упоре.\",\n        \"Ноги возвращаются далеко от рук.\",\n        \"Темп слишком высокий — техника теряется.\"\n      ],\n      \"tip\": \"Если упор лёжа удерживать трудно, поставьте ладони на устойчивую опору повыше (стол, прочное сиденье). Когда движение станет уверенным, можно перейти к «Бёрпи».\"\n    },\n    \"close_grip_incline_pushup\": {\n      \"name\": \"Узкие отжимания с упором на возвышение\",\n      \"aliases\": [\n        \"отжимания на трицепс\",\n        \"узкие отжимания от стола\",\n        \"щадящие для трицепса\"\n      ],\n      \"desc\": \"Отжимания узким хватом от устойчивой опоры: основная нагрузка на трицепс и грудь. Более щадящая замена обратным отжиманиям от стула.\",\n      \"start\": \"Упритесь ладонями в устойчивую неподвижную опору (стол или стул, прижатый к стене): кисти под грудью, чуть уже плеч. Тело — прямая линия от головы до пяток.\",\n      \"steps\": [\n        \"Согните руки и опустите грудь к краю опоры; локти прижаты к корпусу и направлены назад.\",\n        \"Остановитесь, не доходя до опоры несколько сантиметров.\",\n        \"Вытолкните себя вверх до выпрямления рук.\",\n        \"Корпус ровный, пресс напряжён, шея продолжает линию спины.\"\n      ],\n      \"mistakes\": [\n        \"Опора неустойчива или скользит.\",\n        \"Локти расходятся в стороны.\",\n        \"Таз провисает или поднимается «домиком».\"\n      ],\n      \"tip\": \"Чем выше опора, тем легче упражнение; чем ниже, тем тяжелее. Если нагрузка на запястья неприятна, поставьте кисти чуть шире.\"\n    },\n    \"backpack_row\": {\n      \"name\": \"Тяга рюкзака в наклоне\",\n      \"aliases\": [\n        \"тяга рюкзака\",\n        \"тяга с рюкзаком\",\n        \"тяга в наклоне\",\n        \"гребля\"\n      ],\n      \"desc\": \"Тяговое упражнение для спины с минимальным инвентарём: рюкзак с грузом тянут к животу. Используется как упражнение с сопротивлением.\",\n      \"start\": \"Положите в рюкзак книги или бутылки с водой так, чтобы лямки и ручка держались надёжно. Встаньте, стопы на ширине таза, колени слегка согнуты, возьмите рюкзак двумя руками.\",\n      \"steps\": [\n        \"Наклоните корпус вперёд от тазобедренных суставов; спина прямая, взгляд в пол перед собой. Рюкзак висит на прямых руках.\",\n        \"Подтяните рюкзак к низу живота, сводя лопатки; локти идут назад вдоль корпуса.\",\n        \"Задержитесь на секунду и медленно опустите рюкзак.\",\n        \"Угол наклона корпуса не меняйте в течение подхода.\"\n      ],\n      \"mistakes\": [\n        \"Спина округляется.\",\n        \"Рюкзак тянется рывком, корпус раскачивается.\",\n        \"Груз слишком тяжёлый — техника нарушается.\"\n      ],\n      \"tip\": \"Вес подбирайте так, чтобы все повторения выполнялись с ровной спиной. Движения без груза (например, «снежный ангел») — лёгкая работа и не заменяют тягу с сопротивлением.\"\n    },\n    \"split_squat\": {\n      \"name\": \"Статичный выпад\",\n      \"aliases\": [\n        \"сплит-присед\"\n      ],\n      \"desc\": \"Одноопорный присед на месте: стопы остаются на полу, двигается только таз вверх и вниз. Подготовка к выпадам.\",\n      \"start\": \"Сделайте шаг вперёд и встаньте на обе ноги: передняя стопа на полу целиком, задняя — на носке. Руки на поясе.\",\n      \"steps\": [\n        \"Вес распределите на обе ноги, корпус держите прямо.\",\n        \"Опускайте таз вертикально вниз, пока переднее колено не согнётся примерно до 90°.\",\n        \"Переднее колено смотрит в ту же сторону, что и носок.\",\n        \"Оттолкнитесь передней ногой и поднимитесь. Выполните подходы на одну сторону, затем на другую.\"\n      ],\n      \"mistakes\": [\n        \"Переднее колено заваливается внутрь.\",\n        \"Таз уходит вперёд-назад вместо движения вниз-вверх.\",\n        \"Корпус сильно наклоняется вперёд.\"\n      ],\n      \"tip\": \"При потере равновесия держитесь рукой за стену или спинку стула.\"\n    },\n    \"bulgarian_split_squat\": {\n      \"name\": \"Болгарский сплит-присед\",\n      \"aliases\": [\n        \"присед с опорой ноги на стул\"\n      ],\n      \"desc\": \"Присед на одной ноге: задняя нога лежит на стуле. Для тех, кто уверенно делает выпады и статичный выпад.\",\n      \"start\": \"Встаньте спиной к устойчивому стулу, поставьте заднюю стопу носком на сиденье, передняя нога на шаг вперёд. Стул не должен скользить.\",\n      \"steps\": [\n        \"Корпус держите прямо, взгляд вперёд.\",\n        \"Опускайтесь вертикально вниз, пока бедро передней ноги не станет почти параллельно полу.\",\n        \"Вес в основном на передней ноге, пятка прижата к полу.\",\n        \"Поднимитесь, отталкиваясь передней ногой. Затем смените сторону.\"\n      ],\n      \"mistakes\": [\n        \"Корпус наклоняется вперёд, колено уходит за носок.\",\n        \"Слишком близкая постановка передней стопы.\",\n        \"Стул скользит или неустойчив.\"\n      ],\n      \"tip\": \"Не получается — вернитесь к статичному выпаду или к выпадам назад.\"\n    },\n    \"backpack_rdl\": {\n      \"name\": \"Румынская тяга с рюкзаком\",\n      \"aliases\": [\n        \"тяга на прямых ногах\"\n      ],\n      \"desc\": \"Наклон с отведением таза назад: нагрузка на заднюю поверхность бедра и ягодицы. Без рюкзака — только вес рук.\",\n      \"start\": \"Встаньте, стопы на ширине таза, колени слегка согнуты. Держите рюкзак двумя руками перед бёдрами.\",\n      \"steps\": [\n        \"Отведите таз назад, как будто хотите закрыть дверь ягодицами.\",\n        \"Рюкзак скользит вдоль ног; спина остаётся прямой, взгляд на пол перед собой.\",\n        \"Опускайтесь до ощущения натяжения сзади бёдер, обычно чуть ниже колен.\",\n        \"Вернитесь вверх, выпрямляя таз вперёд, а не отклоняясь назад.\"\n      ],\n      \"mistakes\": [\n        \"Округляется спина.\",\n        \"Движение превращается в присед: колени сгибаются слишком сильно.\",\n        \"Рюкзак уходит далеко от ног.\"\n      ],\n      \"tip\": \"Сначала освойте движение без груза, затем добавляйте вес в рюкзаке.\"\n    },\n    \"single_leg_rdl\": {\n      \"name\": \"Тяга на одной ноге\",\n      \"aliases\": [\n        \"румынская тяга на одной ноге\"\n      ],\n      \"desc\": \"Наклон на одной ноге: нагрузка на заднюю поверхность бедра и ягодицы, плюс устойчивость.\",\n      \"start\": \"Встаньте на одну ногу, колено слегка согнуто. Для опоры можно коснуться рукой стены.\",\n      \"steps\": [\n        \"Отведите таз назад, свободная нога уходит назад как продолжение корпуса.\",\n        \"Спина прямая, таз смотрит в пол — без разворота в сторону.\",\n        \"Опускайтесь, пока корпус не приблизится к горизонтали, или до предела без округления спины.\",\n        \"Вернитесь вверх, затем смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Таз раскрывается в сторону.\",\n        \"Спина округляется.\",\n        \"Опорное колено полностью выпрямлено и «заперто».\"\n      ],\n      \"tip\": \"Касайтесь стены кончиками пальцев и постепенно убирайте опору.\"\n    },\n    \"towel_hamstring_curl\": {\n      \"name\": \"Сгибание ног с полотенцем\",\n      \"aliases\": [\n        \"скольжение пятками\"\n      ],\n      \"desc\": \"Лёжа на спине, пятки скользят по полотенцу: задняя поверхность бедра работает без оборудования. Нужен гладкий пол.\",\n      \"start\": \"Лягте на спину, пятки на полотенце на гладком полу, колени согнуты. Приподнимите таз.\",\n      \"steps\": [\n        \"Удерживая таз приподнятым, медленно выпрямляйте ноги, скользя пятками.\",\n        \"Остановитесь, пока можете держать таз ровно.\",\n        \"Подтяните пятки обратно к тазу, не опуская таз.\",\n        \"Опустите таз в конце подхода.\"\n      ],\n      \"mistakes\": [\n        \"Таз проваливается.\",\n        \"Последняя треть амплитуды выполняется рывком.\",\n        \"Поясница прогибается.\"\n      ],\n      \"tip\": \"Если ноги не удерживаются — сократите амплитуду или вернитесь к ягодичному мостику на одной ноге.\"\n    },\n    \"lateral_lunge\": {\n      \"name\": \"Боковой выпад\",\n      \"aliases\": [\n        \"выпад в сторону\"\n      ],\n      \"desc\": \"Шаг в сторону с отведением таза назад: нагрузка в боковой плоскости, приводящие мышцы и ягодицы.\",\n      \"start\": \"Встаньте прямо, стопы вместе, руки перед грудью.\",\n      \"steps\": [\n        \"Шагните в сторону широко, носки смотрят вперёд.\",\n        \"Отведите таз назад и вбок, согнув колено шагнувшей ноги; вторая нога остаётся прямой.\",\n        \"Пятка рабочей ноги прижата к полу.\",\n        \"Оттолкнитесь и вернитесь в исходное положение.\"\n      ],\n      \"mistakes\": [\n        \"Колено заваливается внутрь.\",\n        \"Пятка рабочей ноги отрывается от пола.\",\n        \"Корпус слишком наклоняется вперёд.\"\n      ],\n      \"tip\": \"Начните с небольшой глубины и узкого шага.\"\n    },\n    \"prone_ytw\": {\n      \"name\": \"Буквы Y, T, W лёжа\",\n      \"aliases\": [\n        \"Y-T-W\"\n      ],\n      \"desc\": \"Подъём рук в положении лёжа на животе: верх спины и задние пучки плеч. Помогает сбалансировать жимовые упражнения.\",\n      \"start\": \"Лягте на живот, лоб на полу, руки вытянуты вперёд и вверх буквой Y, большие пальцы смотрят вверх.\",\n      \"steps\": [\n        \"Поднимите руки от пола без подъёма груди, лопатки сводятся к позвоночнику.\",\n        \"Опустите, затем повторите в положении «T» — руки в стороны.\",\n        \"Затем «W» — локти согнуты, прижаты к бокам.\",\n        \"Один повтор — все три положения.\"\n      ],\n      \"mistakes\": [\n        \"Рывки и раскачивание.\",\n        \"Прогиб в пояснице, поднимается грудь.\",\n        \"Плечи поднимаются к ушам.\"\n      ],\n      \"tip\": \"Если трудно — делайте без удержания, а на следующих неделях добавляйте паузу 2 с.\"\n    },\n    \"wall_angel\": {\n      \"name\": \"Стенной ангел\",\n      \"aliases\": [\n        \"снежный ангел у стены\"\n      ],\n      \"desc\": \"Скольжение руками по стене: подвижность лопаток и грудного отдела.\",\n      \"start\": \"Встаньте спиной к стене, ступни на ширине таза на небольшом расстоянии от неё, поясница и лопатки у стены. Руки согнуты у стены.\",\n      \"steps\": [\n        \"Прижмите затылок, лопатки и поясницу к стене без напряжения.\",\n        \"Медленно скользите руками вверх, не отрывая локти и кисти от стены.\",\n        \"Опустите руки вниз по той же траектории.\",\n        \"Выполните в комфортной для вас амплитуде.\"\n      ],\n      \"mistakes\": [\n        \"Поясница прогибается и отрывается от стены.\",\n        \"Плечи поднимаются к ушам.\",\n        \"Кисти или локти отходят от стены.\"\n      ],\n      \"tip\": \"Не страшно, если руки не достают до стены полностью: берите амплитуду, где сохраняется контакт.\"\n    },\n    \"decline_pushup\": {\n      \"name\": \"Отжимания с ногами на стуле\",\n      \"aliases\": [\n        \"отжимания с опорой ног\"\n      ],\n      \"desc\": \"Усложнённые отжимания: ноги выше рук, нагрузка на грудь и плечи больше.\",\n      \"start\": \"Руки на полу на ширине плеч, ступни на сиденье устойчивого стула. Корпус прямой.\",\n      \"steps\": [\n        \"Напрягите пресс и ягодицы, тело — прямая линия.\",\n        \"Опускайтесь, сгибая локти примерно под 45° к корпусу.\",\n        \"Грудь опускается к полу, пока не почувствуете растяжение.\",\n        \"Выпрямите руки, толкая пол.\"\n      ],\n      \"mistakes\": [\n        \"Провал таза.\",\n        \"Локти широко в стороны.\",\n        \"Стул скользит, упор нестабилен.\"\n      ],\n      \"tip\": \"Если техника ломается, вернитесь к обычным отжиманиям.\"\n    },\n    \"side_plank_knee\": {\n      \"name\": \"Боковая планка с опорой на колено\",\n      \"aliases\": [\n        \"облегчённая боковая планка\"\n      ],\n      \"desc\": \"Облегчённая боковая планка: колени согнуты, нагрузка на косые мышцы живота и стабилизаторы корпуса.\",\n      \"start\": \"Лягте на бок, колени согнуты, опора на предплечье, локоть под плечом.\",\n      \"steps\": [\n        \"Приподнимите таз от пола, чтобы тело от плеча до колена образовало прямую линию.\",\n        \"Держите шею продолжением позвоночника.\",\n        \"Дышите ровно.\",\n        \"В конце подхода плавно опуститесь, затем смените сторону.\"\n      ],\n      \"mistakes\": [\n        \"Таз проваливается.\",\n        \"Плечо уходит к уху, нет опоры на руку.\",\n        \"Корпус заваливается вперёд или назад.\"\n      ],\n      \"tip\": \"Когда продержитесь 30 с на каждую сторону два занятия подряд, переходите к обычной боковой планке.\"\n    },\n    \"hollow_hold\": {\n      \"name\": \"Удержание «лодочка»\",\n      \"aliases\": [\n        \"холлоу\"\n      ],\n      \"desc\": \"Статическое удержание на спине: поясница прижата, плечи и ноги над полом. Для тех, кто уверенно держит «мёртвого жука».\",\n      \"start\": \"Лягте на спину, руки за головой или вдоль тела, поясница прижата к полу.\",\n      \"steps\": [\n        \"Прижмите поясницу к полу.\",\n        \"Поднимите плечи и вытянутые ноги над полом на высоту, при которой поясница не отрывается.\",\n        \"Удерживайте положение.\",\n        \"Опустите ноги и плечи в конце подхода.\"\n      ],\n      \"mistakes\": [\n        \"Поясница отрывается от пола.\",\n        \"Задержка дыхания.\",\n        \"Ноги опущены слишком низко для текущей силы.\"\n      ],\n      \"tip\": \"Сгибайте колени или поднимайте ноги выше, если поясница отрывается.\"\n    },\n    \"goblet_squat\": {\n      \"name\": \"Присед с рюкзаком у груди\",\n      \"aliases\": [\n        \"гоблет-присед\"\n      ],\n      \"desc\": \"Присед с грузом перед грудью: нагрузка на квадрицепсы и ягодицы выше, чем в обычном приседе.\",\n      \"start\": \"Прижмите рюкзак к груди двумя руками, стопы чуть шире таза, носки слегка в стороны.\",\n      \"steps\": [\n        \"Напрягите корпус, рёбра опущены.\",\n        \"Опускайтесь вниз, колени идут по линии носков.\",\n        \"Поднимитесь, отталкиваясь всей стопой.\",\n        \"Рюкзак остаётся у груди.\"\n      ],\n      \"mistakes\": [\n        \"Колени заваливаются внутрь.\",\n        \"Пятки отрываются от пола.\",\n        \"Корпус сильно наклоняется вперёд.\"\n      ],\n      \"tip\": \"Вес рюкзака подбирайте так, чтобы техника не ломалась.\"\n    },\n    \"wall_pushup\": {\n      \"name\": \"Отжимания от стены\",\n      \"aliases\": [],\n      \"desc\": \"Самый лёгкий вариант отжиманий: стоя у стены. Подходит для первых занятий.\",\n      \"start\": \"Встаньте на расстоянии шага от стены, ладони на стене на уровне груди чуть шире плеч.\",\n      \"steps\": [\n        \"Тело — прямая линия от макушки до пяток.\",\n        \"Сгибайте локти, приближая грудь к стене.\",\n        \"Оттолкнитесь, выпрямляя руки.\",\n        \"Дышите ровно.\"\n      ],\n      \"mistakes\": [\n        \"Таз выпячивается назад.\",\n        \"Локти широко в стороны.\",\n        \"Слишком короткая амплитуда.\"\n      ],\n      \"tip\": \"Чем дальше ноги от стены, тем тяжелее упражнение.\"\n    },\n    \"backpack_overhead_press\": {\n      \"name\": \"Жим рюкзака над головой\",\n      \"aliases\": [\n        \"жим вверх\"\n      ],\n      \"desc\": \"Жим груза над головой стоя: плечи и трицепс.\",\n      \"start\": \"Встаньте, стопы на ширине таза, рюкзак у плеч, локти перед собой.\",\n      \"steps\": [\n        \"Напрягите пресс и ягодицы.\",\n        \"Выжмите рюкзак вверх над головой, руки выпрямляются.\",\n        \"Медленно опустите к плечам.\",\n        \"Корпус остаётся прямым.\"\n      ],\n      \"mistakes\": [\n        \"Прогиб в пояснице.\",\n        \"Рюкзак уходит перед лицом.\",\n        \"Рывок ногами.\"\n      ],\n      \"tip\": \"Если плечи дискомфортны, уменьшите вес или выберите другое упражнение.\"\n    },\n    \"backpack_curl\": {\n      \"name\": \"Сгибания рук с рюкзаком\",\n      \"aliases\": [\n        \"бицепс\"\n      ],\n      \"desc\": \"Сгибание рук с рюкзаком: бицепс и предплечья.\",\n      \"start\": \"Встаньте прямо, держите рюкзак за ручку одной рукой (или двумя руками за лямки), руки опущены.\",\n      \"steps\": [\n        \"Прижмите локти к корпусу.\",\n        \"Согните руки, поднимая рюкзак к плечам.\",\n        \"Медленно опустите.\",\n        \"Корпус не раскачивайте.\"\n      ],\n      \"mistakes\": [\n        \"Раскачивание корпусом.\",\n        \"Локти уходят вперёд.\",\n        \"Рывки вместо контроля.\"\n      ],\n      \"tip\": \"Подбирайте вес так, чтобы последние повторения были тяжёлыми, но техника не страдала.\"\n    },\n    \"backpack_triceps_extension\": {\n      \"name\": \"Разгибание рук с рюкзаком\",\n      \"aliases\": [\n        \"трицепс\"\n      ],\n      \"desc\": \"Разгибание рук из-за головы с рюкзаком: трицепс.\",\n      \"start\": \"Встаньте или сядьте, держите рюкзак обеими руками за головой, локти направлены вверх.\",\n      \"steps\": [\n        \"Прижмите локти ближе к голове.\",\n        \"Выпрямите руки вверх.\",\n        \"Медленно опустите рюкзак за голову.\",\n        \"Корпус не прогибайте.\"\n      ],\n      \"mistakes\": [\n        \"Локти расходятся в стороны.\",\n        \"Прогиб в пояснице.\",\n        \"Слишком тяжёлый вес.\"\n      ],\n      \"tip\": \"При боли в локтях уменьшите вес или остановитесь.\"\n    },\n    \"backpack_wrist_curl\": {\n      \"name\": \"Сгибания кистей с рюкзаком\",\n      \"aliases\": [\n        \"предплечья\"\n      ],\n      \"desc\": \"Сгибание кисти с грузом: предплечья.\",\n      \"start\": \"Сядьте, предплечье на колене или краю стула ладонью вверх, кисть свешивается. В руке лёгкий рюкзак за ручку.\",\n      \"steps\": [\n        \"Опустите кисть вниз, пальцы разжимаются.\",\n        \"Согните кисть вверх, сжимая рюкзак.\",\n        \"Предплечье не двигается.\",\n        \"Выполните повторения, затем смените руку.\"\n      ],\n      \"mistakes\": [\n        \"Двигается всё предплечье.\",\n        \"Слишком тяжёлый груз.\",\n        \"Рывки.\"\n      ],\n      \"tip\": \"Груз должен быть лёгким — предплечья небольшие мышцы.\"\n    },\n    \"single_leg_calf_raise\": {\n      \"name\": \"Подъёмы на носок на одной ноге\",\n      \"aliases\": [],\n      \"desc\": \"Подъём на носок на одной ноге: икры, более тяжёлая версия.\",\n      \"start\": \"Встаньте на одну ногу, лёгкая опора рукой о стену.\",\n      \"steps\": [\n        \"Поднимитесь на носок, насколько можете.\",\n        \"Задержитесь на секунду вверху.\",\n        \"Медленно опуститесь.\",\n        \"Затем смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Рывки.\",\n        \"Колено сгибается.\",\n        \"Сильная опора руками.\"\n      ],\n      \"tip\": \"Если трудно — сначала на обеих ногах.\"\n    },\n    \"clamshell\": {\n      \"name\": \"«Ракушка»\",\n      \"aliases\": [\n        \"клэмшелл\"\n      ],\n      \"desc\": \"Раскрытие колена лёжа на боку: средняя ягодичная мышца.\",\n      \"start\": \"Лягте на бок, колени согнуты, стопы вместе, голова на руке.\",\n      \"steps\": [\n        \"Не разрывая стопы, поднимайте верхнее колено вверх.\",\n        \"Таз неподвижен, не заваливайтесь назад.\",\n        \"Задержитесь на секунду вверху.\",\n        \"Медленно опустите. Смените сторону.\"\n      ],\n      \"mistakes\": [\n        \"Таз заваливается назад.\",\n        \"Движение рывками.\",\n        \"Слишком большая амплитуда за счёт поясницы.\"\n      ],\n      \"tip\": \"Положите руку на таз, чтобы чувствовать, что он остаётся неподвижным.\"\n    },\n    \"side_lying_leg_raise\": {\n      \"name\": \"Подъём ноги лёжа на боку\",\n      \"aliases\": [],\n      \"desc\": \"Отведение прямой ноги лёжа на боку: средняя ягодичная мышца.\",\n      \"start\": \"Лягте на бок, нижняя нога слегка согнута, верхняя вытянута, носок смотрит вперёд.\",\n      \"steps\": [\n        \"Поднимите верхнюю ногу вверх на небольшую высоту.\",\n        \"Таз не заваливается назад, носок не смотрит вверх.\",\n        \"Задержитесь на секунду вверху.\",\n        \"Медленно опустите. Смените сторону.\"\n      ],\n      \"mistakes\": [\n        \"Нога уходит вперёд и таз заваливается.\",\n        \"Поясница прогибается.\",\n        \"Рывки и инерция.\"\n      ],\n      \"tip\": \"Высота не важна, важно держать таз неподвижным.\"\n    }\n  },\n  \"programs\": {\n    \"b1_full_a\": {\n      \"name\": \"Всё тело A (начальный)\",\n      \"desc\": \"Базовая программа для начинающих и возвращающихся после перерыва: приседание, жим, тяга, задняя поверхность бедра и кор.\",\n      \"note\": \"Чередуйте с «Всё тело B»; между занятиями — минимум день. Для тяги нужен рюкзак с грузом. Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"b2_full_b\": {\n      \"name\": \"Всё тело B (начальный)\",\n      \"desc\": \"Вторая программа для начинающих: выпады, тяга на заднюю поверхность бедра, отжимания с упором на колени, верх спины и кор.\",\n      \"note\": \"Чередуйте с «Всё тело A». Без рюкзака выполняйте румынскую тягу без груза. Ориентир на 4 недели (редакционный, результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои
