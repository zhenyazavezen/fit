<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F12">
<meta name="color-scheme" content="dark">
<meta name="build" content="1c99cd5f">
<title>ZAVEZEN_FIT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A0A0B'/%3E%3Cpath d='M18 20h28L30 46' fill='none' stroke='%23ECEDEF' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Дизайн-токены ZAVEZEN_FIT. Единственное место, где задаются цвета, радиусы, отступы и размеры.
   Компоненты (app.css) используют только эти переменные. Тема одна — тёмная. */
:root {
  color-scheme: dark;

  /* поверхности */
  --bg: #0F0F12;
  --s1: #19191D;
  --s2: #222227;
  --s3: #2E2E34;
  --line: #3E3E46;

  /* текст */
  --text: #FAFAFB;
  --text2: #B8B8C0;
  --text3: #9C9CA6;

  /* светлые акценты (без ярких цветов) */
  --silver: #D2D4DA;
  --platinum: #F1F2F4;
  --on-platinum: #0F0F12;
  --halo: rgba(239, 240, 242, 0.10);
  --danger: #E3A19F;
  --danger-bg: rgba(227, 161, 159, 0.1);

  /* типографика */
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --fs-xs: 11px;
  --fs-s: 13px;
  --fs-m: 15px;
  --fs-l: 17px;
  --fs-xl: 22px;
  --fs-xxl: 28px;

  /* радиусы */
  --r-m: 16px;
  --r-l: 22px;
  --r-xl: 28px;

  /* отступы */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;

  /* размеры */
  --gutter: 20px;
  --touch: 44px;
  --tabbar-h: 64px;
  --btn-h: 56px;
  --maxw: 560px;

  /* Telegram и безопасные зоны (задаются из JS) */
  --tg-top: 0px;
  --tg-bottom: 0px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Компоненты и экраны ZAVEZEN_FIT. Значения берутся из tokens.css. */
@font-face { font-family: 'Manrope'; src: local('Manrope'); font-display: swap; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-m); line-height: 1.45;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; border-radius: 6px; }

.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; }

/* ---------- каркас */
#app {
  height: var(--app-h, 100%); max-width: var(--maxw); margin: 0 auto; display: flex; flex-direction: column;
  background: var(--bg); position: relative; overflow: hidden;
}
#app::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: var(--tg-top); background: var(--bg); z-index: 30; pointer-events: none; }
#screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; margin-top: var(--tg-top); outline: none; }
#screen.enter > * { animation: fade .18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #screen.enter > *, .sheet, .scrim, .toast { animation: none !important; } * { transition: none !important; } }

.pad { padding: 0 max(var(--gutter), var(--safe-left)) var(--sp-8) max(var(--gutter), var(--safe-right)); }
.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.row-flex { display: flex; align-items: center; gap: var(--sp-3); }
.grow { flex: 1; min-width: 0; }

/* ---------- типографика */
.h1 { font-size: var(--fs-xxl); line-height: 1.15; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.h2 { font-size: var(--fs-xl); line-height: 1.2; font-weight: 700; letter-spacing: -.015em; }
.h3 { font-size: var(--fs-l); line-height: 1.3; font-weight: 600; }
.eyebrow { font-size: var(--fs-xs); letter-spacing: .09em; text-transform: uppercase; color: var(--text3); font-weight: 600; }
.muted { color: var(--text2); }
.small { font-size: var(--fs-s); }
.num { font-variant-numeric: tabular-nums; }
.section { display: flex; align-items: baseline; justify-content: space-between; margin: var(--sp-8) 0 var(--sp-3); }

/* ---------- верхняя панель экрана */
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) max(var(--sp-3), var(--safe-left)) var(--sp-2); background: linear-gradient(var(--bg) 80%, transparent); min-height: 60px; }
.topbar .title { flex: 1; min-width: 0; font-weight: 600; font-size: var(--fs-l); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: var(--touch); height: var(--touch); display: inline-grid; place-items: center; border-radius: 50%; color: var(--text); flex: none; transition: background .15s; }
.icon-btn:active { background: var(--s3); }
.page-title { padding: var(--sp-4) 0 var(--sp-2); }

/* ---------- кнопки */
.btn { min-height: var(--btn-h); padding: 0 var(--sp-6); border-radius: var(--r-m); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); font-weight: 600; font-size: var(--fs-l); background: var(--platinum); color: var(--on-platinum); width: 100%; text-align: center; transition: transform .12s, background .15s, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--s2); color: var(--text); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid transparent; }
.btn.small { min-height: var(--touch); font-size: var(--fs-m); width: auto; padding: 0 var(--sp-5); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.link-btn { color: var(--silver); font-size: var(--fs-s); font-weight: 600; min-height: var(--touch); display: inline-flex; align-items: center; gap: 2px; }

/* ---------- карточки и строки */
.card { background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-l); padding: var(--sp-5); }
.list { background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-l); overflow: hidden; }
.item { display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-height: 64px; padding: var(--sp-3) var(--sp-4); text-align: left; position: relative; }
.item + .item { border-top: 1px solid var(--s3); }
button.item:active, a.item:active { background: var(--s2); }
.item .t { font-weight: 600; font-size: var(--fs-m); line-height: 1.3; }
.item .s { font-size: var(--fs-s); color: var(--text2); line-height: 1.35; margin-top: 1px; }
.item .end { color: var(--text3); font-size: var(--fs-s); text-align: right; white-space: nowrap; display: flex; align-items: center; gap: var(--sp-1); }
.item .lead { width: 28px; color: var(--text3); font-weight: 600; font-size: var(--fs-s); flex: none; text-align: center; }
a.item { color: inherit; text-decoration: none; }

.badge { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--s2); border: 1px solid var(--line); color: var(--text2); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.badges { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

.chips { display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 2px var(--gutter); }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.chip { flex: none; min-height: var(--touch); padding: 0 var(--sp-4); display: inline-flex; align-items: center; gap: 6px; border-radius: 22px; background: var(--s2); border: 1px solid var(--line); color: var(--text2); font-size: var(--fs-m); font-weight: 600; transition: background .15s, color .15s; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--platinum); color: var(--on-platinum); border-color: var(--platinum); }
.chip .ic { width: 18px; height: 18px; }

.seg { display: flex; background: var(--s2); border-radius: var(--r-m); padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 40px; border-radius: 12px; font-weight: 600; font-size: var(--fs-m); color: var(--text2); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--platinum); color: var(--on-platinum); }

.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--s3); border: 1px solid var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text2); transition: transform .2s var(--ease), background .2s; }
.switch[aria-checked="true"] { background: var(--platinum); border-color: var(--platinum); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--on-platinum); }

.input { width: 100%; min-height: var(--btn-h); background: var(--s2); border: 1px solid var(--line); border-radius: var(--r-m); padding: 0 var(--sp-4); color: var(--text); font-size: var(--fs-l); }
.input::placeholder { color: var(--text3); }
.input:focus { outline: none; border-color: var(--silver); }
.search { position: relative; }
.search .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
.search .input { padding-left: 48px; padding-right: 48px; }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }

.stepper { display: flex; align-items: center; gap: var(--sp-3); }
.stepper .val { min-width: 56px; text-align: center; font-weight: 700; font-size: var(--fs-xl); font-variant-numeric: tabular-nums; }
.stepper .icon-btn { background: var(--s2); border: 1px solid var(--line); }

.empty { text-align: center; padding: var(--sp-10) var(--sp-4); display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
.empty .ic { width: 36px; height: 36px; color: var(--text3); }
.empty p { color: var(--text2); max-width: 30ch; }
.note { display: flex; gap: var(--sp-3); padding: var(--sp-4); background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-m); color: var(--text2); font-size: var(--fs-s); line-height: 1.5; }
.note .ic { width: 18px; height: 18px; margin-top: 1px; color: var(--text3); }

/* ---------- нижняя навигация */
#tabbar { display: flex; background: var(--s1); border-top: 1px solid var(--s3); padding: 0 max(var(--sp-1), var(--safe-left)) calc(var(--safe-bottom) + var(--tg-bottom)); flex: none; }
#tabbar button { flex: 1; min-width: 0; height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text3); font-size: 10.5px; letter-spacing: -.01em; font-weight: 600; }
#tabbar button[aria-current="true"] { color: var(--platinum); }
#tabbar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- шторки, диалоги, уведомления */
#layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .62); pointer-events: auto; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 50%; bottom: 0; width: 100%; max-width: var(--maxw); transform: translateX(-50%); background: var(--s1); border-top: 1px solid var(--line); border-radius: var(--r-xl) var(--r-xl) 0 0; max-height: 88%; display: flex; flex-direction: column; pointer-events: auto; animation: up .26s var(--ease); padding-bottom: calc(var(--safe-bottom) + var(--tg-bottom)); }
@keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 0; flex: none; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5) var(--sp-2); flex: none; }
.sheet .body { overflow-y: auto; padding: var(--sp-2) var(--sp-5) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-4); }
.sheet .foot { display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5) var(--sp-4); border-top: 1px solid var(--s3); flex: none; }
.sheet .foot .btn { flex: 1; }
.sheet .foot .btn:first-child:not(:last-child) { flex: 0 0 auto; width: auto; }

.toast { position: absolute; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-bottom) + var(--tg-bottom) + 16px); transform: translateX(-50%); max-width: calc(100% - 40px); background: var(--platinum); color: var(--on-platinum); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: var(--fs-s); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); animation: up .22s var(--ease); pointer-events: none; text-align: center; }
body[data-route="player"] .toast { bottom: calc(var(--safe-bottom) + var(--tg-bottom) + 100px); }

/* ---------- главная */
.greet { padding: var(--sp-6) 0 var(--sp-5); }
.greet .h1 { margin-top: 4px; }
.hero { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: var(--sp-6) var(--sp-5) var(--sp-5); border: 1px solid var(--line); background: radial-gradient(120% 90% at 100% 0%, var(--halo), transparent 60%), linear-gradient(180deg, var(--s2), var(--s1)); display: flex; flex-direction: column; gap: var(--sp-3); }
.hero .name { font-size: 30px; line-height: 1.08; font-weight: 700; letter-spacing: -.025em; text-wrap: balance; }
.hero .time { font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: var(--sp-2); }
.hero .meta { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); color: var(--text2); font-size: var(--fs-s); font-weight: 600; }
.hero .actions { display: flex; gap: var(--sp-3); margin-top: var(--sp-3); }
.hero .actions .btn:first-child { flex: 1; }
.hero .actions .btn.ghost { width: auto; padding: 0 var(--sp-5); font-size: var(--fs-m); }
.resume { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4); border-radius: var(--r-l); background: var(--s2); border: 1px solid var(--line); margin-bottom: var(--sp-4); }
.resume .btn { width: auto; min-height: var(--touch); padding: 0 var(--sp-5); font-size: var(--fs-m); }

.weekcard { display: flex; flex-direction: column; gap: var(--sp-4); }
.dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dot { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text3); font-weight: 600; }
.dot i { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--on-platinum); }
.dot.done i { background: var(--platinum); border-color: var(--platinum); }
.dot.today { color: var(--text); }
.dot.today i { border-color: var(--silver); }
.dot .ic { width: 16px; height: 16px; stroke-width: 2.2; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); border-top: 1px solid var(--s3); padding-top: var(--sp-4); }
.kpi .v { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: var(--fs-xs); color: var(--text3); font-weight: 600; margin-top: 2px; }
.hscroll { display: flex; gap: var(--sp-3); overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 2px var(--gutter); scroll-snap-type: x proximity; }
.hscroll::-webkit-scrollbar { display: none; }
.pcard { flex: none; width: 200px; min-height: 148px; scroll-snap-align: start; border-radius: var(--r-l); background: var(--s1); border: 1px solid var(--s3); padding: var(--sp-4); display: flex; flex-direction: column; justify-content: space-between; gap: var(--sp-3); text-align: left; }
.pcard:active { background: var(--s2); }
.pcard .t { font-weight: 700; font-size: var(--fs-l); line-height: 1.2; letter-spacing: -.01em; }
.pcard .m { color: var(--text2); font-size: var(--fs-s); font-weight: 600; }

/* ---------- программы */
.pcard-wide { display: flex; flex-direction: column; gap: var(--sp-3); width: 100%; text-align: left; background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-l); padding: var(--sp-5); }
.pcard-wide:active { background: var(--s2); }
.pcard-wide .top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); }
.pcard-wide .t { font-size: var(--fs-xl); font-weight: 700; line-height: 1.15; letter-spacing: -.015em; }
.pcard-wide .d { color: var(--text2); font-size: var(--fs-s); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
.fact { background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r-m); padding: var(--sp-3) var(--sp-3); min-width: 0; }
.fact .v { font-weight: 700; font-size: var(--fs-l); font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.fact .l { font-size: var(--fs-xs); color: var(--text3); font-weight: 600; margin-top: 2px; }
.sticky-cta { position: sticky; bottom: 0; padding: var(--sp-4) 0 var(--sp-4); background: linear-gradient(transparent, var(--bg) 35%); margin-top: var(--sp-4); }

/* ---------- каталог и карточка упражнения */
.catalog-head { position: sticky; top: 0; z-index: 4; background: var(--bg); padding-bottom: var(--sp-3); }
.count { color: var(--text3); font-size: var(--fs-s); font-weight: 600; margin: var(--sp-3) 0; }
.fav-btn[aria-pressed="true"] { color: var(--platinum); }
.fav-btn[aria-pressed="true"] .ic { fill: currentColor; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
.steps li { counter-increment: s; display: flex; gap: var(--sp-4); line-height: 1.5; }
.steps li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--s2); display: grid; place-items: center; font-size: var(--fs-s); font-weight: 700; color: var(--silver); margin-top: -1px; }
.bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--sp-3); }
.bullets li { position: relative; padding-left: 20px; color: var(--text2); line-height: 1.5; }
.bullets li::before { content: ''; position: absolute; left: 4px; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--text3); }
.block { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-8); }
.block:first-child { margin-top: 0; }
.chipset { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.mchip { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 17px; font-size: var(--fs-s); font-weight: 600; border: 1px solid var(--line); background: var(--s2); color: var(--text2); }
.mchip.primary { background: var(--platinum); border-color: var(--platinum); color: var(--on-platinum); }
.dose-card { display: flex; align-items: center; gap: var(--sp-4); }
.dose-card .big { font-size: 34px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }

/* ---------- конструктор */
.item .mini { display: flex; gap: 2px; }
.item .mini .icon-btn { width: 40px; height: 40px; color: var(--text2); }

/* ---------- экран тренировки */
.player { min-height: 100%; height: 100%; display: flex; flex-direction: column; padding-bottom: calc(var(--safe-bottom) + var(--tg-bottom)); }
#screen:has(.player) { overflow: hidden; }
.p-top { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) max(var(--sp-3), var(--safe-left)) 0; flex: none; }
.p-count { flex: 1; text-align: center; font-size: var(--fs-s); font-weight: 600; color: var(--text2); }
.p-segs { display: flex; gap: 3px; padding: var(--sp-3) max(var(--gutter), var(--safe-left)) 0; flex: none; }
.p-segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--s3); overflow: hidden; position: relative; }
.p-segs i b { position: absolute; inset: 0; background: var(--platinum); transform-origin: left; transform: scaleX(var(--p, 0)); }

#tabbar { touch-action: none; }

.sheet { box-shadow: 0 -16px 40px rgba(0, 0, 0, .5); }

/* =====  Анимации: только transform/opacity, короткие, без бесконечных циклов (кроме индикатора загрузки)  ===== */
@keyframes slidein { from { opacity: 0; transform: translateX(18px); } }
@keyframes slideback { from { opacity: 0; transform: translateX(-14px); } }
@keyframes sheen { from { transform: translateX(-130%); } to { transform: translateX(130%); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes bargrow { from { transform: scaleY(0); } }

/* переходы между экранами: вперёд — вправо, назад — влево, вкладки — мягкое появление блоков по очереди */

#screen.enter.back > * { animation: slideback .22s var(--ease); }

#screen.enter.tab > .pad > *:nth-child(4) { animation-delay: 120ms; }

/* кнопки: нажатие слегка утапливает, по главной кнопке проходит мягкий блик */
.btn { position: relative; overflow: hidden; transition: transform .14s var(--ease), box-shadow .2s, filter .15s, background .15s, opacity .15s; }
.btn:active { transform: scale(.975); filter: brightness(.95); }
.btn:not(.secondary):not(.ghost):not(.danger)::after { content: ''; position: absolute; inset: 0; pointer-events: none; transform: translateX(-130%);
  background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .6) 50%, transparent 62%); }
.btn:not(.secondary):not(.ghost):not(.danger):active::after { transform: translateX(130%); transition: transform .5s var(--ease); }
.card.today .btn::after, .sticky-cta .btn::after { animation: sheen 1.2s var(--ease) .7s 1 both; }
.icon-btn { transition: background .15s, transform .12s var(--ease); }
.icon-btn:active { transform: scale(.92); }
.chip { transition: background .15s, color .15s, transform .12s var(--ease); }

/* карточки и строки: лёгкое нажатие */
button.card, .pcard-wide, .pcard, .level-plate, .mine-main, button.item, a.item { transition: transform .15s var(--ease), background .15s; }

.cl-main:active .cl-box { transform: scale(.88); }
.cl-row.done .cl-box .ic { animation: pop .28s var(--ease); }
.cl-row { animation: rise .22s var(--ease); }

/* прогресс: индикатор заполняется, столбцы графика вырастают */
.bar i { transform-origin: left center; animation: grow .7s var(--ease) backwards; }
.chart .bar { transform-box: fill-box; transform-origin: center bottom; animation: bargrow .55s var(--ease) backwards; }
.dot.done i { animation: pop .35s var(--ease) backwards; }

/* итог тренировки: последовательное появление */
.seq { animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 90ms + 120ms); }
.fin-ring { width: 84px; height: 84px; margin: 4px auto 14px; display: block; }
.fin-ring circle { fill: none; stroke: var(--platinum); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 227; stroke-dashoffset: 227; transform: rotate(-90deg); transform-origin: 50% 50%; animation: draw .8s var(--ease) .1s forwards; }
.fin-ring path { fill: none; stroke: var(--platinum); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .4s var(--ease) .75s forwards; }

/* загрузка: стартовый экран и индикатор в списках */
.boot { min-height: 60vh; display: grid; place-items: center; }
.spin { display: none; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--s3); border-top-color: var(--silver); animation: spin .8s linear infinite; }
.spin-wrap { display: grid; place-items: center; padding: var(--sp-8) 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .spin { animation: none !important; border-top-color: var(--silver); border-right-color: var(--silver); }
  .fin-ring circle, .fin-ring path { stroke-dashoffset: 0; }
}
.vol { width: 100%; accent-color: var(--silver); }

/* ---------- Компактнее: меньше пустых отступов в плашках */
.card { padding: var(--sp-4); }

.card.today { gap: 8px; }

<script type="application/json" id="app-bundle">{"files":{"data/cards.json":"{\n  \"squat\": \"assets/cards/squat.jpg\"\n}\n","data/content.ru.json":"{\n  \"exercises\": {\n    \"squat\": {\n      \"name\": \"Приседания\",\n      \"aliases\": [\n        \"присед\",\n        \"squat\"\n      ],\n      \"desc\": \"Базовое приседание с собственным весом: нагружает бёдра и ягодицы.\",\n      \"start\": \"Встаньте, стопы немного шире таза, носки чуть развёрнуты в стороны. Сложите ладони перед грудью или скрестите руки.\",\n      \"steps\": [\n        \"Начинайте с таза: сначала отведите его назад, затем сгибайте колени.\",\n        \"Опускайтесь на комфортную глубину; хорошо, если бёдра доходят почти до параллели с полом.\",\n        \"Колени двигаются в ту же сторону, куда смотрят носки, и не сходятся внутрь; вес приходится на всю стопу.\",\n        \"Поднимайтесь, надавливая на пол всей стопой, и в конце движения выпрямите таз.\"\n      ],\n      \"mistakes\": [\n        \"Колени сходятся друг к другу при подъёме.\",\n        \"Пятки отрываются, вес уходит на носки.\",\n        \"Спина округляется внизу или сильно выгибается в пояснице.\"\n      ],\n      \"tip\": \"Если трудно удерживать равновесие, разведите руки в стороны или уменьшите глубину.\"\n    },\n    \"sumo_squat\": {\n      \"name\": \"Сумо-приседания\",\n      \"aliases\": [\n        \"сумо\"\n      ],\n      \"desc\": \"Приседания с широкой постановкой ног: больше нагрузки на ягодицы и внутреннюю поверхность бёдер.\",\n      \"start\": \"Встаньте с широкой постановкой ног — заметно шире плеч. Носки развёрнуты наружу на 30–45°.\",\n      \"steps\": [\n        \"Опуститесь вниз, разводя колени в стороны по линии носков.\",\n        \"Корпус вертикален, таз опускается между стопами.\",\n        \"Задержитесь на секунду внизу.\",\n        \"Вернитесь вверх, сжимая ягодицы.\"\n      ],\n      \"mistakes\": [\n        \"Колени уходят внутрь.\",\n        \"Корпус наклоняется вперёд.\",\n        \"Стопы поставлены шире, чем позволяет подвижность.\"\n      ],\n      \"tip\": \"Глубину выбирайте так, чтобы спина оставалась ровной.\"\n    },\n    \"reverse_lunge\": {\n      \"name\": \"Выпады назад\",\n      \"aliases\": [\n        \"выпады\"\n      ],\n      \"desc\": \"Одноопорное упражнение для ног и ягодиц: шаг назад и возврат в исходное положение.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза, руки на поясе.\",\n      \"steps\": [\n        \"Сделайте широкий шаг назад одной ногой.\",\n        \"Опуститесь, сгибая обе ноги примерно до 90°; заднее колено движется к полу, не касаясь его.\",\n        \"Передняя пятка прижата к полу, корпус прямой.\",\n        \"Оттолкнитесь передней ногой и вернитесь в исходное положение, затем повторите другой ногой.\"\n      ],\n      \"mistakes\": [\n        \"Передняя пятка отрывается от пола.\",\n        \"Корпус сильно наклоняется вперёд.\",\n        \"Шаг слишком короткий — нагрузка уходит в колено.\"\n      ],\n      \"tip\": \"Если трудно удерживать равновесие, держитесь за опору или делайте шаг короче.\"\n    },\n    \"glute_bridge\": {\n      \"name\": \"Ягодичный мост\",\n      \"aliases\": [\n        \"мост\"\n      ],\n      \"desc\": \"Подъём таза лёжа на спине: работают ягодицы и задняя поверхность бёдер.\",\n      \"start\": \"Лягте на спину, согните колени и поставьте стопы на пол на ширине таза, недалеко от ягодиц. Руки лежат вдоль тела.\",\n      \"steps\": [\n        \"На выдохе поднимайте таз, отталкиваясь стопами от пола.\",\n        \"Поднимитесь до положения, когда плечи, таз и колени образуют одну наклонную линию.\",\n        \"Вверху сильно напрягите ягодицы и задержитесь на секунду-другую, не выгибая поясницу.\",\n        \"Опускайте таз медленно, пока не коснётесь пола.\"\n      ],\n      \"mistakes\": [\n        \"Таз поднят слишком высоко, поясница выгнута.\",\n        \"Усилие ощущается в пояснице или задней части бедра, а не в ягодицах.\",\n        \"Колени сводятся или разъезжаются.\"\n      ],\n      \"tip\": \"Если поясница напрягается, поднимайте таз ниже. Усложнение — «Ягодичный мост на одной ноге».\"\n    },\n    \"single_leg_bridge\": {\n      \"name\": \"Ягодичный мост на одной ноге\",\n      \"aliases\": [\n        \"мост на одной ноге\"\n      ],\n      \"desc\": \"Подъём таза на одной ноге: нагрузка на ягодицу опорной ноги и работа мышц для устойчивости таза.\",\n      \"start\": \"Лягте на спину. Одну стопу поставьте на пол, колено согнуто. Другую ногу поднимите и удерживайте согнутой над грудью.\",\n      \"steps\": [\n        \"Опираясь на стопу опорной ноги, поднимайте таз.\",\n        \"Следите, чтобы обе стороны таза оставались на одном уровне.\",\n        \"Вверху на секунду напрягите ягодицу опорной ноги.\",\n        \"Опускайтесь плавно. Все повторения делайте на одной ноге, затем поменяйте ногу.\"\n      ],\n      \"mistakes\": [\n        \"Таз заваливается в сторону поднятой ноги.\",\n        \"Подъём выполняется рывком.\",\n        \"Вы помогаете себе, упираясь руками в пол.\"\n      ],\n      \"tip\": \"Если трудно сохранять ровный таз, вернитесь к «Ягодичному мосту».\"\n    },\n    \"calf_raise\": {\n      \"name\": \"Подъёмы на носки\",\n      \"aliases\": [\n        \"икры\"\n      ],\n      \"desc\": \"Простое упражнение для икроножных мышц и устойчивости голеностопа.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза. При необходимости держитесь за опору.\",\n      \"steps\": [\n        \"Встаньте прямо, стопы на ширине таза; при необходимости держитесь за опору.\",\n        \"Медленно поднимитесь на носки как можно выше.\",\n        \"Задержитесь на секунду вверху.\",\n        \"Плавно опуститесь на пол.\"\n      ],\n      \"mistakes\": [\n        \"Слишком быстрый темп.\",\n        \"Колени сгибаются.\",\n        \"Стопы разворачиваются внутрь или наружу.\"\n      ],\n      \"tip\": \"При необходимости держитесь за опору. Опускайтесь медленно, без рывков.\"\n    },\n    \"pushup\": {\n      \"name\": \"Отжимания\",\n      \"aliases\": [\n        \"отжимание\"\n      ],\n      \"desc\": \"Классическое упражнение для груди, плеч и трицепса, которое одновременно требует работы корпуса.\",\n      \"start\": \"Упор лёжа: ладони чуть шире плеч, тело — прямая линия от головы до пяток, пресс напряжён.\",\n      \"steps\": [\n        \"Согните руки и опустите грудь к полу; локти направлены назад под углом около 45° к корпусу.\",\n        \"Опуститесь до касания грудью пола или остановитесь в нескольких сантиметрах от него.\",\n        \"Вытолкните себя вверх до выпрямления рук.\",\n        \"Корпус остаётся ровным на протяжении всего повторения.\"\n      ],\n      \"mistakes\": [\n        \"Таз провисает или поднимается «домиком».\",\n        \"Локти разведены строго в стороны.\",\n        \"Неполная амплитуда.\"\n      ],\n      \"tip\": \"Если не получается выполнять повторения с ровным корпусом, перейдите на «Отжимания с колен» или «Отжимания с упором на возвышение».\"\n    },\n    \"knee_pushup\": {\n      \"name\": \"Отжимания с колен\",\n      \"aliases\": [\n        \"отжимания с коленей\"\n      ],\n      \"desc\": \"Облегчённый вариант отжиманий для начала работы с собственным весом.\",\n      \"start\": \"Встаньте в упор на колени: ладони чуть шире плеч, линия от колен до головы прямая.\",\n      \"steps\": [\n        \"Согните руки и опустите грудь к полу.\",\n        \"Локти направлены назад под углом около 45°.\",\n        \"Вытолкните себя вверх до выпрямления рук.\",\n        \"Таз не отставляйте назад — корпус остаётся прямым.\"\n      ],\n      \"mistakes\": [\n        \"Таз отведён назад.\",\n        \"Неполная амплитуда.\",\n        \"Голова опущена вниз.\"\n      ],\n      \"tip\": \"Подложите под колени мягкую подушку или коврик.\"\n    },\n    \"pike_pushup\": {\n      \"name\": \"Отжимания «горкой»\",\n      \"aliases\": [\n        \"пайк\",\n        \"горка\"\n      ],\n      \"desc\": \"Отжимания с поднятым тазом: смещают нагрузку на плечи.\",\n      \"start\": \"Из упора лёжа поднимите таз вверх: тело образует перевёрнутую букву V, руки и ноги почти прямые.\",\n      \"steps\": [\n        \"Согните руки, опуская макушку к полу между кистями.\",\n        \"Локти направлены назад и немного в стороны.\",\n        \"Вытолкните себя вверх, возвращая таз высоко.\",\n        \"Шея нейтральна, движение контролируемое.\"\n      ],\n      \"mistakes\": [\n        \"Таз опускается — упражнение превращается в обычные отжимания.\",\n        \"Резкий удар головой о пол.\",\n        \"Колени чрезмерно согнуты.\"\n      ],\n      \"tip\": \"Если трудно, уменьшите амплитуду. Не опускайте голову резко: макушка движется к полу плавно.\"\n    },\n    \"plank\": {\n      \"name\": \"Планка\",\n      \"aliases\": [\n        \"планка на локтях\"\n      ],\n      \"desc\": \"Удержание положения для мышц кора: учит стабилизировать корпус.\",\n      \"start\": \"Упор на предплечья: локти под плечами, тело — прямая линия от головы до пяток.\",\n      \"steps\": [\n        \"Напрягите пресс и ягодицы.\",\n        \"Не позволяйте тазу провисать или подниматься.\",\n        \"Смотрите в пол, шея продолжает линию спины.\",\n        \"Дышите ровно, не задерживая дыхание.\"\n      ],\n      \"mistakes\": [\n        \"Поясница провисает.\",\n        \"Таз слишком высоко поднят.\",\n        \"Плечи уходят к ушам.\"\n      ],\n      \"tip\": \"Если трудно, выполняйте упражнение с колен или с упором на устойчивое возвышение. Заканчивайте подход, когда техника ухудшается.\"\n    },\n    \"side_plank\": {\n      \"name\": \"Боковая планка\",\n      \"aliases\": [\n        \"планка на боку\"\n      ],\n      \"desc\": \"Удержание на боку для косых мышц живота и стабилизаторов корпуса.\",\n      \"start\": \"Лягте на бок, вытянув ноги и сложив их вместе. Согнутую руку опустите на пол для упора на предплечье.\",\n      \"steps\": [\n        \"Поставьте локоть точно под плечо и оттолкнитесь предплечьем от пола, отодвигая плечо от уха.\",\n        \"Поднимите таз, ца отрывается от пола, сгибайте колени или опускайте ноги не так низко.\"\n    },\n    \"dead_bug\": {\n      \"name\": \"Мёртвый жук\",\n      \"aliases\": [\n        \"жук\"\n      ],\n      \"desc\": \"Упражнение для кора: поясница остаётся неподвижной, пока руки и ноги двигаются по очереди.\",\n      \"start\": \"Лягте на спину, вытяните руки вертикально вверх. Поднимите согнутые ноги так, чтобы голени были параллельны полу.\",\n      \"steps\": [\n        \"Слегка напрягите пресс и сохраняйте поясницу прижатой к полу на протяжении всего упражнения.\",\n        \"На выдохе одновременно опустите одну руку за голову и вытяните противоположную ногу.\",\n        \"Остановитесь, не касаясь пола, и верните руку и ногу в исходное положение.\",\n        \"Повторите с другой руки и ноги, двигаясь медленно.\"\n      ],\n      \"mistakes\": [\n        \"Поясница отрывается от пола и выгибается.\",\n        \"Руки и ноги быстро падают вниз.\",\n        \"Задержка дыхания.\"\n      ],\n      \"tip\": \"Облегчение: двигайте только ногами, руки оставьте вытянутыми к потолку.\"\n    },\n    \"mountain_climber\": {\n      \"name\": \"Скалолаз\",\n      \"aliases\": [\n        \"альпинист\"\n      ],\n      \"desc\": \"Кардио-упражнение в упоре лёжа: пульс растёт, пресс и плечи работают.\",\n      \"start\": \"Упор лёжа на прямых руках, тело — прямая линия.\",\n      \"steps\": [\n        \"Поочерёдно подтягивайте колени к груди.\",\n        \"Плечи над кистями, таз не поднимается.\",\n        \"Темп — от умеренного до быстрого.\",\n        \"Дышите ровно.\"\n      ],\n      \"mistakes\": [\n        \"Таз слишком высоко.\",\n        \"Руки уходят вперёд от плеч.\",\n        \"Жёсткие удары стопами об пол.\"\n      ],\n      \"tip\": \"Облегчение: поставьте ладони на устойчивую опору повыше и двигайтесь спокойнее.\"\n    },\n    \"jumping_jack\": {\n      \"name\": \"Прыжки «звёздочка»\",\n      \"aliases\": [\n        \"джампинг джек\",\n        \"звёздочка\"\n      ],\n      \"d ение: поднимайте только руку или только ногу.\"\n    },\n    \"plank_taps\": {\n      \"name\": \"Планка с касанием плеч\",\n      \"aliases\": [\n        \"касания плеч\"\n      ],\n      \"desc\": \"Планка на прямых руках с поочерёдными касаниями плеча: учит удерживать корпус неподвижным.\",\n      \"start\": \"Примите упор лёжа на прямых руках: кисти под плечами, стопы поставлены шире, чем в обычной планке, тело прямое.\",\n      \"steps\": [\n        \"Напрягите пресс и ягодицы, чтобы корпус был жёстким.\",\n        \"Перенесите вес на одну руку и коснитесь ладонью другой руки противоположного плеча.\",\n        \"Верните руку на пол и повторите другой рукой.\",\n        \"Следите, чтобы таз не раскачивался из стороны в сторону.\"\n      ],\n      \"mistakes\": [\n        \"Таз раскачивается при каждом касании.\",\n        \"Таз поднимается вверх.\",\n        \"Стопы стоят слишком узко, поэтому трудно сохранять равновесие.\"\n      ],\n      \"tip\": \"Если таз раскачивается, поставьте стопы шире или вернитесь к «Планке».\"\n    },\n    \"arm_circles\": {\n      \"name\": \"Круги руками\",\n      \"aliases\": [\n        \"вращения руками\"\n      ],\n      \"desc\": \"Небольшие круги руками для разогрева плечевых суставов.\",\n      \"start\": \"Встаньте ровно, разведите прямые руки в стороны до уровня плеч, ладони смотрят вниз.\",\n      \"steps\": [\n        \"Рисуйте руками небольшие круги, не сгибая локти.\",\n        \"Через 15 секунд поменяйте направление вращения.\",\n        \"Плечи расслаблены и опущены, шея свободна.\",\n        \"Постепенно увеличивайте размер кругов.\"\n      ],\n      \"mistakes\": [\n        \"Плечи подтягиваются к ушам.\",\n        \"Движения резкие.\",\n        \"Слишком большие круги с первых секунд.\"\n      ]\n    },\n    \"cat_cow\": {\n      \"name\": \"Кошка–корова\",\n      \"aliases\": [\n        \"кошка\",\n        \"кот-корова\"\n      ],\n      \"desc\": \"Плавные движения позвоночника в ритме дыхания.\",\n      \"start\": \"Опуститесь на четвереньки: запястья под плечами, колени под тазом, шея продолжает линию спины.\",\n      \"steps\": [\n        \"На вдохе мягко прогните спину вниз: живот опускается, грудь и таз тянутся вверх, взгляд поднимается вперёд.\",\n        \"На выдохе выгните спину вверх дугой и подтяните подбородок к груди.\",\n        \"Переходите из одного положения в другое плавно, подстраивая темп под дыхание.\",\n        \"Двигайтесь только в комфортном диапазоне, без боли.\"\n      ],\n      \"mistakes\": [\n        \"Слишком быстрый темп.\",\n        \"Локти сгибаются.\",\n        \"Резкий прогиб в пояснице.\"\n      ],\n      \"tip\": \"Двигайтесь в комфортной амплитуде и в ритме дыхания.\"\n    },\n    \"lunge_twist\": {\n      \"name\": \"Выпад с поворотом корпуса\",\n      \"aliases\": [\n        \"выпад с поворотом\"\n      ],\n      \"desc\": \"Динамическая разминка: открывает тазобедренные суставы и грудной отдел.\",\n      \"start\": \"Встаньте прямо и сделайте широкий выпад вперёд, руки перед грудью.\",\n      \"steps\": [\n        \"Опустите заднее колено к полу.\",\n        \"Поверните корпус в сторону передней ноги, раскройте руку.\",\n        \"Вернитесь в центр.\",\n        \"Выпрямитесь в исходное положение и смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Передняя пятка отрывается.\",\n        \"Поворот только руками, а не корпусом.\",\n        \"Колено заваливается внутрь.\"\n      ]\n    },\n    \"thoracic_rotation\": {\n      \"name\": \"Вращения грудного отдела\",\n      \"aliases\": [\n        \"ротация грудного отдела\",\n        \"открывание груди\"\n      ],\n      \"desc\": \"Мобилизация верхней части спины и плеч в положении на четвереньках.\",\n      \"start\": \"Встаньте на четвереньки, одна ладонь за головой.\",\n      \"steps\": [\n        \"На выдохе поверните корпус и локоть вниз — к опорной руке.\",\n        \"На вдохе раскройте грудь, поднимая локоть к потолку.\",\n        \"Таз остаётся неподвижным.\",\n        \"Выполните повторения и смените руку.\"\n      ],\n      \"mistakes\": [\n        \"Поворот за счёт поясницы.\",\n        \"Таз сдвигается назад.\",\n        \"Слишком резкие движения.\"\n      ]\n    },\n    \"child_pose\": {\n      \"name\": \"Поза ребёнка\",\n      \"aliases\": [\n        \"ребёнок\"\n      ],\n      \"desc\": \"Спокойная растяжка спины и бёдер.\",\n      \"start\": \"Встаньте на четвереньки, большие пальцы стоп соприкасаются, колени чуть шире таза.\",\n      \"steps\": [\n        \"Отведите таз назад к пяткам.\",\n        \"Вытяните руки вперёд, лоб опустите на пол.\",\n        \"Дышите медленно и глубоко.\",\n        \"Если колени дискомфортны, подложите подушку между бёдрами и икрами.\"\n      ],\n      \"mistakes\": [\n        \"Рывок назад.\",\n        \"Напряжение в плечах.\",\n        \"Задержка дыхания.\"\n      ]\n    },\n    \"hamstring_stretch\": {\n      \"name\": \"Растяжка задней поверхности бедра\",\n      \"aliases\": [\n        \"растяжка бедра сзади\"\n      ],\n      \"desc\": \"Мягкая растяжка мышц задней поверхности бедра сидя.\",\n      \"start\": \"Сядьте на пол, одну ногу выпрямите, другую согните стопой к бедру.\",\n      \"steps\": [\n        \"Наклонитесь вперёд от бёдер к выпрямленной ноге.\",\n        \"Спина длинная, не округляйте её сильно.\",\n        \"Растяжение должно быть комфортным, без боли.\",\n        \"Смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Сильное округление спины.\",\n        \"Рывки.\",\n        \"Растяжение до боли.\"\n      ],\n      \"tip\": \"Растяжение должно быть комфортным; при боли уменьшите наклон.\"\n    },\n    \"quad_stretch\": {\n      \"name\": \"Растяжка квадрицепса стоя\",\n      \"aliases\": [\n        \"растяжка передней поверхности бедра\"\n      ],\n      \"desc\": \"Растяжка передней поверхности бедра в положении стоя.\",\n      \"start\": \"Встаньте прямо, при необходимости держитесь за опору.\",\n      \"steps\": [\n        \"Согните одну ногу и возьмите стопу рукой.\",\n        \"Подтяните пятку к ягодице, колени рядом.\",\n        \"Корпус прямой, таз слегка подкручен вперёд.\",\n        \"Смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Колено уходит далеко вперёд.\",\n        \"Поясница прогибается.\",\n        \"Потеря равновесия без опоры.\"\n      ]\n    },\n    \"figure_four\": {\n      \"name\": \"Растяжка «четвёрка» лёжа\",\n      \"aliases\": [\n        \"четвёрка\",\n        \"растяжка ягодиц\"\n      ],\n      \"desc\": \"Растяжка ягодичных мышц и наружной поверхности бедра лёжа на спине.\",\n      \"start\": \"Лягте на спину, ноги согнуты, стопы на полу.\",\n      \"steps\": [\n        \"Положите лодыжку одной ноги на колено другой.\",\n        \"Обхватите бедро опорной ноги и потяните к груди.\",\n        \"Почувствуйте растяжение в ягодице.\",\n        \"Смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Таз отрывается от пола.\",\n        \"Рывки.\",\n        \"Давление на колено вместо бедра.\"\n      ]\n    },\n    \"hip_flexor_stretch\": {\n      \"name\": \"Растяжка сгибателей бедра\",\n      \"aliases\": [\n        \"выпад на колене\"\n      ],\n      \"desc\": \"Растяжка передней поверхности бедра в выпаде на колене.\",\n      \"start\": \"Встаньте на одно колено (подложите мягкое), другая нога впереди, колено над стопой.\",\n      \"steps\": [\n        \"Подкрутите таз вперёд-вверх, напрягая ягодицу задней ноги.\",\n        \"Корпус прямой, слегка сдвиньтесь вперёд.\",\n        \"Почувствуйте растяжение в передней части бедра задней ноги.\",\n        \"Смените ногу.\"\n      ],\n      \"mistakes\": [\n        \"Поясница прогибается.\",\n        \"Колено передней ноги уходит за носок.\",\n        \"Рывки.\"\n      ]\n    },\n    \"pushup_rotation\": {\n      \"name\": \"Отжимания с поворотом\",\n      \"aliases\": [\n        \"отжимание с ротацией\"\n      ],\n      \"desc\": \"Отжимание, после которого корпус поворачивается в сторону с поднятой рукой. Стороны чередуются.\",\n      \"start\": \"Упор лёжа: ладони под плечами, тело — прямая линия от головы до пяток.\",\n      \"steps\": [\n        \"Согните руки и опустите грудь к полу.\",\n        \"Выпрямите руки и, перенося вес на одну руку, поверните корпус в сторону.\",\n        \"Поднимите свободную руку вверх, взгляд следует за рукой.\",\n        \"Вернитесь в упор лёжа и повторите в другую сторону.\"\n      ],\n      \"mistakes\": [\n        \"Таз провисает.\",\n        \"Поворот выполняется рывком.\",\n        \"Опорная рука смещается далеко от линии плеча.\"\n      ],\n      \"tip\": \"Облегчить упражнение можно, выполняя его с колен.\"\n    },\n    \"step_jack\": {\n      \"name\": \"Шаги «звёздочка»\",\n      \"aliases\": [\n        \"звёздочка без прыжков\",\n        \"степ джек\",\n        \"jack\"\n      ],\n      \"desc\": \"Вариант «звёздочки» без прыжков: шаги в стороны с подъёмом рук. Одна стопа всегда стоит на полу.\",\n      \"start\": \"Встаньте прямо, стопы вместе, руки вдоль тела.\",\n      \"steps\": [\n        \"Шагните правой ногой в сторону и одновременно поднимите руки через стороны над головой.\",\n        \"Приставьте левую ногу к правой и опустите руки.\",\n        \"Шагните в другую сторону и повторите, чередуя стороны.\",\n        \"Дышите ровно; темп выбирайте такой, чтобы сохранять контроль.\"\n      ],\n      \"mistakes\": [\n        \"Шаг слишком широкий — теряется равновесие.\",\n        \"Руки не поднимаются выше плеч.\",\n        \"Корпус наклоняется в сторону шага.\"\n      ],\n      \"tip\": \"Подходит вместо «звёздочки», если прыжки вам не подходят. Когда движение станет привычным, можно перейти к прыжковому варианту.\"\n    },\n    \"march_in_place\": {\n      \"name\": \"Марш на месте с подъёмом колен\",\n      \"aliases\": [\n        \"марш\",\n        \"ходьба на месте\",\n        \"шаги на месте\"\n      ],\n      \"desc\": \"Шаги на месте с активной работой рук и бёдер, без прыжков и бега.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза, руки согнуты в локтях.\",\n      \"steps\": [\n        \"Поочерёдно поднимайте колени примерно до уровня таза; одна стопа всегда стоит на полу.\",\n        \"Руки двигаются навстречу ногам, как при быстрой ходьбе.\",\n        \"Корпус прямой, плечи расслаблены, стопы опускайте мягко.\",\n        \"Ускоряйтесь постепенно, пока дыхание остаётся ровным.\"\n      ],\n      \"mistakes\": [\n        \"Корпус откидывается назад.\",\n        \"Шаги слишком короткие — упражнение превращается в ходьбу на месте.\",\n        \"Стопы опускаются на пятки с ударом.\"\n      ],\n      \"tip\": \"Вариант без ударной нагрузки: подходит вместо «Бега с высоким подъёмом колен» и «Бега на месте».\"\n    },\n    \"step_skater\": {\n      \"name\": \"Конькобежец шагом\",\n      \"aliases\": [\n        \"скейтер без прыжков\",\n        \"конькобежец без прыжка\"\n      ],\n      \"desc\": \"Боковые шаги с переносом веса и отведением ноги назад, без прыжков.\",\n      \"start\": \"Встаньте прямо, стопы на ширине таза, колени слегка согнуты.\",\n      \"steps\": [\n        \"Сделайте широкий шаг вправо и перенесите вес на правую ногу, колено слегка согнуто.\",\n        \"Левую ногу отведите назад и вбок за правую; носок едва касается пола.\",\n        \"Руки качнитесь навстречу ногам для равновесия.\",\n        \"Одним плавным шагом перенесите вес на левую ногу и повторите в другую сторону.\"\n      ],\n      \"mistakes\": [\n        \"Колено опорной ноги заваливается внутрь.\",\n        \"Корпус сильно наклоняется вперёд.\",\n        \"Темп слишком высокий — теряется контроль.\"\n      ],\n      \"tip\": \"Вариант без прыжка: подходит вместо «Конькобежца».\"\n    },\n    \"burpee_step\": {\n      \"name\": \"Бёрпи без прыжка и отжимания\",\n      \"aliases\": [\n        \"берпи без прыжка\",\n        \"бёрпи шагом\",\n        \"бёрпи облегчённые\"\n      ],\n      \"desc\": \"Облегчённый вариант бёрпи: приседание, упор лёжа и подъём без отжимания и без прыжка.\",\n      \"start\": \"Встаньте прямо, стопы на ширине плеч.\",\n      \"steps\": [\n        \"Присядьте и поставьте ладони на пол перед собой.\",\n        \"По одной отведите ноги назад в упор лёжа; тело — прямая линия.\",\n        \"По одной верните ноги к рукам.\",\n        \"Выпрямитесь и поднимите руки вверх без прыжка.\"\n      ],\n      \"mistakes\": [\n        \"Поясница провисает в упоре.\",\n        \"Ноги возвращаются далеко от рук.\",\n        \"Темп слишком высокий — техника теряется.\"\n      ],\n      \"tip\": \"Если упор лёжа удерживать трудно, поставьте ладони на устойчивую опору повыше (стол, прочное сиденье). Когда движение станет уверенным, можно перейти к «Бёрпи».\"\n    },\n    \"split_squat\": {\n      \"name\": \"Статичный выпад\",\n      \"aliases\": [\n        \"сплит-присед\"\n      ],\n      \"desc\": \"Одноопорный присед на месте: стопы остаются на полу, двигается только таз вверх и вниз. Подготовка к выпадам.\",\n      \"start\": \"Сделайте шаг вперёд и встаньте на обе ноги: передняя стопа на полу целиком, задняя — на носке. Руки на поясе.\",\n      \"steps\": [\n        \"Вес распределите на обе ноги, корпус держите прямо.\",\n        \"Опускайте таз вертикально вниз, пока переднее колено не согнётся примерно до 90°.\",\n        \"Переднее колено смотрит в ту же сторону, что и носок.\",\n        \"Оттолкнитесь передней ногой и поднимитесь. Выполните подходы на одну сторону, затем на другую.\"\n      ],\n      \"mistakes\": [\n        \"Переднее колено заваливается внутрь.\",\n        \"Таз уходит вперёд-назад вместо движения вниз-вверх.\",\n        \"Корпус сильно наклоняется вперёд.\"\n      ],\n      \"tip\": \"При потере равновесия сократите шаг и расставьте стопы чуть шире.\"\n    },\n    \"lateral_lunge\": {\n      \"name\": \"Боковой выпад\",\n      \"aliases\": [\n        \"выпад в сторону\"\n      ],\n      \"desc\": \"Шаг в сторону с отведением таза назад: нагрузка в боковой плоскости, приводящие мышцы и ягодицы.\",\n      \"start\": \"Встаньте прямо, стопы вместе, руки перед грудью.\",\n      \"steps\": [\n        \"Шагните в сторону широко, носки смотрят вперёд.\",\n        \"Отведите таз назад и вбок, согнув колено шагнувшей ноги; вторая нога остаётся прямой.\",\n        \"Пятка рабочей ноги прижата к полу.\",\n        \"Оттолкнитесь и вернитесь в исходное положение.\"\n      ],\n      \"mistakes\": [\n        \"Колено заваливается внутрь.\",\n        \"Пятка рабочей ноги отрывается от пола.\",\n        \"Корпус слишком наклоняется вперёд.\"\n      ],\n      \"tip\": \"Начните с небольшой глубины и узкого шага.\"\n    },\n    \"prone_ytw\": {\n      \"name\": \"Буквы Y, T, W лёжа\",\n      \"aliases\": [\n        \"Y-T-W\"\n      ],\n      \"desc\": \"Подъём рук в положении лёжа на животе: верх спины и задние пучки плеч. Помогает сбалансировать жимовые упражнения.\",\n      \"start\": \"Лягте на живот, лоб на полу, руки вытянуты вперёд и вверх буквой Y, большие пальцы смотрят вверх.\",\n      \"steps\": [\n        \"Поднимите руки от пола без подъёма груди, лопатки сводятся к позвоночнику.\",\n        \"Опустите, затем повторите в положении «T» — руки в стороны.\",\n        \"Затем «W» — локти согнуты, прижаты к бокам.\",\n        \"Один повтор — все три положения.\"\n      ],\n      \"mistakes\": [\n        \"Рывки и раскачивание.\",\n        \"Прогиб в пояснице, поднимается грудь.\",\n        \"Плечи поднимаются к ушам.\"\n      ],\n      \"tip\": \"Если трудно — делайте без удержания, а на следующих неделях добавляйте паузу 2 с.\"\n    },\n    \"side_plank_knee\": {\n      \"name\": \"Боковая планка с опорой на колено\",\n      \"aliases\": [\n        \"облегчённая боковая планка\"\n      ],\n      \"desc\": \"Облегчённая боковая планка: колени согнуты, нагрузка на косые мышцы живота и стабилизаторы корпуса.\",\n      \"start\": \"Лягте на бок, колени согнуты, опора на предплечье, локоть под плечом.\",\n      \"steps\": [\n        \"Приподнимите таз от пола, чтобы тело от плеча до колена образовало прямую линию.\",\n        \"Держите шею продолжением позвоночника.\",\n        \"Дышите ровно.\",\n        \"В конце подхода плавно опуститесь, затем смените сторону.\"\n      ],\n      \"mistakes\": [\n        \"Таз проваливается.\",\n        \"Плечо уходит к уху, нет опоры на руку.\",\n        \"Корпус заваливается вперёд или назад.\"\n      ],\n      \"tip\": \"Когда продержитесь 30 с на каждую сторону два занятия подряд, переходите к обычной боковой планке.\"\n    },\n    \"hollow_hold\": {\n      \"name\": \"Удержание «лодочка»\",\n      \"aliases\": [\n        \"холлоу\"\n      ],\n      \"desc\": \"Статическое удержание на спине: поясница прижата, плечи и ноги над полом. Для тех, кто уверенно держит «мёртвого жука».\",\n      \"start\": \"Лягте на спину, руки за головой или вдоль тела, поясница прижата к полу.\",\n      \"steps\": [\n        \"Прижмите поясницу к полу.\",\n        \"Поднимите плечи и вытянутые ноги над полом на высоту, при которой поясница не отрывается.\",\n        \"Удерживайте положение.\",\n        \"Опустите ноги и плечи в конце подхода.\"\n      ],\n      \"mistakes\": [\n        \"Поясница отрывается от пола.\",\n        \"Задержка дыхания.\",\n        \"Ноги опущены слишком низко для текущей силы.\"\n      ],\n      \"tip\": \"Сгибайте колени или поднимайте ноги выше, если поясница отрывается.\"\n    },\n    \"clamshell\": {\n      \"name\": \"«Ракушка»\",\n      \"aliases\": [\n        \"клэмшелл\"\n      ],\n      \"desc\": \"Раскрытие колена лёжа на боку: средняя ягодичная мышца.\",\n      \"start\": \"Лягте на бок, колени согнуты, стопы вместе, голова на руке.\",\n      \"steps\": [\n        \"Не разрывая стопы, поднимайте верхнее колено вверх.\",\n        \"Таз неподвижен, не заваливайтесь назад.\",\n        \"Задержитесь на секунду вверху.\",\n        \"Медленно опустите. Смените сторону.\"\n      ],\n      \"mistakes\": [\n        \"Таз заваливается назад.\",\n        \"Движение рывками.\",\n        \"Слишком большая амплитуда за счёт поясницы.\"\n      ],\n      \"tip\": \"Положите руку на таз, чтобы чувствовать, что он остаётся неподвижным.\"\n    },\n    \"side_lying_leg_raise\": {\n      \"name\": \"Подъём ноги лёжа на боку\",\n      \"aliases\": [],\n      \"desc\": \"Отведение прямой ноги лёжа на боку: средняя ягодичная мышца.\",\n      \"start\": \"Лягте на бок, нижняя нога слегка согнута, верхняя вытянута, носок смотрит вперёд.\",\n      \"steps\": [\n        \"Поднимите верхнюю ногу вверх на небольшую высоту.\",\n        \"Таз не заваливается назад, носок не смотрит вверх.\",\n        \"Задержитесь на секунду вверху.\",\n        \"Медленно опустите. Смените сторону.\"\n      ],\n      \"mistakes\": [\n        \"Нога уходит вперёд и таз заваливается.\",\n        \"Поясница прогибается.\",\n        \"Рывки и инерция.\"\n      ],\n      \"tip\": \"Высота не важна, важно держать таз неподвижным.\"\n    }\n  },\n  \"programs\": {\n    \"b1_full_a\": {\n      \"name\": \"Всё тело A (начальный)\",\n      \"desc\": \"Базовая программа для начинающих и возвращающихся после перерыва: приседание, мост, кор и растяжка.\",\n      \"note\": \"Чередуйте с «Всё тело B»; между занятиями — минимум день. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"b2_full_b\": {\n      \"name\": \"Всё тело B (начальный)\",\n      \"desc\": \"Вторая программа для начинающих: выпады, отжимания с упором на колени, верх спины и кор.\",\n      \"note\": \"Чередуйте с «Всё тело A». Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"b3_core_beginner\": {\n      \"name\": \"Кор для начинающих\",\n      \"desc\": \"Стабилизация корпуса: «мёртвый жук», «собака-птица», планки и скручивания.\",\n      \"note\": \"Дополнение к основным программам 1–2 раза в неделю; нагрузка небольшая, можно в день отдыха. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"b4_light_cardio\": {\n      \"name\": \"Лёгкое кардио без прыжков\",\n      \"desc\": \"Выносливость без ударной нагрузки: марш и шаговые варианты упражнений.\",\n      \"note\": \"Темп разговорный. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"i1_upper\": {\n      \"name\": \"Верх тела (средний)\",\n      \"desc\": \"Грудь, плечи, спина и трицепс.\",\n      \"note\": \"Минимум 48 часов до следующей тренировки верха. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"i2_lower\": {\n      \"name\": \"Низ тела (средний)\",\n      \"desc\": \"Ноги, ягодицы и задняя поверхность бедра: одноопорные движения, мост и боковая плоскость.\",\n      \"note\": \"Минимум 48 часов до следующего низа. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"i3_full_strength\": {\n      \"name\": \"Всё тело: сила (средний)\",\n      \"desc\": \"Если время есть только для одного занятия: ноги, жим, верх спины и кор.\",\n      \"note\": \"Минимум 48 часов между занятиями. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"i4_core\": {\n      \"name\": \"Кор (средний)\",\n      \"desc\": \"Стабилизация и боковые мышцы корпуса, один–два раза в неделю.\",\n      \"note\": \"Если боль в пояснице — упростите упражнение или остановитесь. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"i5_intervals\": {\n      \"name\": \"Интервалы (средний)\",\n      \"desc\": \"Интервальная работа: 30 секунд нагрузки, 30 секунд отдыха. Есть упрощённые варианты без прыжков.\",\n      \"note\": \"Минимум 48 часов между интервальными занятиями; не более 2 раз в неделю. Прыжковые — по самочувствию, при боли в суставах замените марш/шаговыми вариантами. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"i6_express\": {\n      \"name\": \"Экспресс-круг (средний)\",\n      \"desc\": \"Короткая круговая тренировка всего тела: 12 станций по 30 секунд, переход 10 секунд.\",\n      \"note\": \"Высокая нагрузка на плечи — не ставьте в один день с «Верх тела». Источник идеи круга — публикация Klika B., Jordan C. High-intensity circuit training using body weight: maximum results with minimal investment. ACSM’s Health & Fitness Journal. 2013; 17(3):8–13 (в оригинале не читал, структура изменена; формат использован как идея).\"\n    },\n    \"a4_core_pro\": {\n      \"name\": \"Кор Pro (продвинутый)\",\n      \"desc\": \"Для тех, кто уверенно держит планку 60 секунд и боковую 40 секунд.\",\n      \"note\": \"Редко: примерно раз в неделю. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"r1_morning_mobility\": {\n      \"name\": \"Утренняя мобильность\",\n      \"desc\": \"Мягкая разминка суставов и позвоночника, отдельно от силовых.\",\n      \"note\": \"Можно ежедневно. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За неделю меняется один параметр; при плохой технике, боли или усталости вернитесь на неделю назад или упростите упражнение. Приложение неделю не переключает автоматически: свои значения можно задать в «Мои программы».\"\n    },\n    \"r2_stretch_after\": {\n      \"name\": \"Растяжка после тренировки\",\n      \"desc\": \"Растяжка основных групп после занятия; стороны отдельно.\",\n      \"note\": \"Тянитесь до лёгкого натяжения, без боли. Примерный план на 4 недели (результат не гарантируется): неделя 1 — как в программе, с запасом сил; неделя 2 — на 2 повторения больше (или на 5 с дольше); неделя 3 — на один подход больше в 2–3 основных упражнениях; неделя 4 — отдых между подходами на 5–10 с короче. За недел
