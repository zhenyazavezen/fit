name: Применить обновление из архива
# Срабатывает, когда в папку incoming/ загружен любой .zip (имя не важно: «update (2).zip» тоже подходит;
# если загружено несколько, берётся самый новый).
# Перед распаковкой архив проверяется (опасные пути, ссылки, размер); затем он
# распаковывается в корень БЕЗ папки .github, архив удаляется, изменения коммитятся
# и запускается публикация сайта.
on:
  push:
    paths: ['incoming/*.zip']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Выбор архива
        id: pick
        run: |
          shopt -s nullglob
          files=(incoming/*.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "Архива в incoming нет — нечего применять"; echo "found=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          # самый новый — по времени коммита (при checkout у всех файлов одинаковое время изменения)
          newest=""; best=-1
          for f in "${files[@]}"; do t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); t=${t:-0}; if [ "$t" -ge "$best" ]; then best=$t; newest=$f; fi; done
          cp "$newest" /tmp/update.zip
          git rm -q --cached incoming/*.zip || true
          rm -f incoming/*.zip
          echo "found=yes" >> "$GITHUB_OUTPUT"
          echo "Взят архив: $newest"
      - name: Проверка архива (Zip Slip, ссылки, размер)
        if: steps.pick.outputs.found == 'yes'
        run: |
          test -f /tmp/update.zip
          # размер самого архива не больше 30 МБ
          [ "$(stat -c %s /tmp/update.zip)" -le 31457280 ] || { echo "Архив слишком большой"; exit 1; }
          # список имён: никаких абсолютных путей, «..», обратных слэшей и управляющих символов
          unzip -Z1 /tmp/update.zip > /tmp/names.txt
          [ "$(wc -l < /tmp/names.txt)" -le 2000 ] || { echo "Слишком много файлов"; exit 1; }
          if grep -nE '(^/|(^|/)\.\.(/|$)|\\|[[:cntrl:]])' /tmp/names.txt; then
            echo "Опасные пути в архиве"; exit 1
          fi
          # символические ссылки в архиве запрещены
          if unzip -Z /tmp/update.zip | grep -E '^l'; then
            echo "В архиве есть символические ссылки"; exit 1
          fi
          # распакованный размер не больше 100 МБ
          TOTAL=$(unzip -Z -t /tmp/update.zip | awk '{print $3}' | head -1)
          [ "${TOTAL:-0}" -le 104857600 ] || { echo "Распакованный размер слишком большой"; exit 1; }
      - name: Распаковка (без .github)
        if: steps.pick.outputs.found == 'yes'
        run: |
          rm -rf /tmp/upd && mkdir /tmp/upd
          unzip -q /tmp/update.zip -d /tmp/upd
          if [ "$(ls -A /tmp/upd | wc -l)" = "1" ] && [ -d "/tmp/upd/$(ls /tmp/upd)" ]; then
            mv /tmp/upd/*/* /tmp/upd/ 2>/dev/null || true
          fi
          rm -rf /tmp/upd/.github /tmp/upd/incoming
          # после распаковки: ни одной ссылки и ни одного файла вне папки
          if find /tmp/upd -type l | grep .; then echo "Найдены ссылки"; exit 1; fi
          cp -a /tmp/upd/. ./
      - name: Коммит
        if: steps.pick.outputs.found == 'yes'
        run: |
          git config user.name "zavezen-bot"
          git config user.email "zavezen-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Изменений нет"; exit 0; }
          if [ -s docs/LAST_UPDATE.txt ]; then git commit -q -F docs/LAST_UPDATE.txt; else git commit -q -m "Обновление проекта из архива"; fi
          git push
      - name: Запуск публикации
        if: steps.pick.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
