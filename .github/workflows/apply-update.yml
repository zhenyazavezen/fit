name: Применить обновление из архива
# Срабатывает, когда в репозиторий загружен файл incoming/update.zip.
# Распаковывает его в корень, НЕ трогая папку .github,
# удаляет архив, коммитит и запускает публикацию сайта.
on:
  push:
    paths: ['incoming/update.zip']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковка (без .github)
        run: |
          test -f incoming/update.zip
          rm -rf /tmp/upd && mkdir /tmp/upd
          unzip -q incoming/update.zip -d /tmp/upd
          if [ "$(ls -A /tmp/upd | wc -l)" = "1" ] && [ -d "/tmp/upd/$(ls /tmp/upd)" ]; then
            mv /tmp/upd/*/* /tmp/upd/ 2>/dev/null || true
          fi
          rm -rf /tmp/upd/.github /tmp/upd/incoming
          cp -a /tmp/upd/. ./
          git rm -q --cached incoming/update.zip
          rm -f incoming/update.zip
      - name: Коммит
        run: |
          git config user.name "zavezen-bot"
          git config user.email "zavezen-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Изменений нет"; exit 0; }
          git commit -m "Обновление проекта из архива"
          git push
      - name: Запуск публикации
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
