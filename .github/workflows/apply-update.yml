name: Применить обновление из архива
# Срабатывает, когда в репозиторий загружен файл incoming/update.zip.
# Перед распаковкой архив проверяется (опасные пути, ссылки, размер); затем он
# распаковывается в корень БЕЗ папки .github, архив удаляется, изменения коммитятся
# и запускается публикация сайта.
on:
  push:
    paths: ['incoming/update.zip']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка архива (Zip Slip, ссылки, размер)
        run: |
          test -f incoming/update.zip
          # размер самого архива не больше 30 МБ
          [ "$(stat -c %s incoming/update.zip)" -le 31457280 ] || { echo "Архив слишком большой"; exit 1; }
          # список имён: никаких абсолютных путей, «..», обратных слэшей и управляющих символов
          unzip -Z1 incoming/update.zip > /tmp/names.txt
          [ "$(wc -l < /tmp/names.txt)" -le 2000 ] || { echo "Слишком много файлов"; exit 1; }
          if grep -nE '(^/|(^|/)\.\.(/|$)|\\|[[:cntrl:]])' /tmp/names.txt; then
            echo "Опасные пути в архиве"; exit 1
          fi
          # символические ссылки в архиве запрещены
          if unzip -Z incoming/update.zip | grep -E '^l'; then
            echo "В архиве есть символические ссылки"; exit 1
          fi
          # распакованный размер не больше 100 МБ
          TOTAL=$(unzip -Z -t incoming/update.zip | awk '{print $3}' | head -1)
          [ "${TOTAL:-0}" -le 104857600 ] || { echo "Распакованный размер слишком большой"; exit 1; }
      - name: Распаковка (без .github)
        run: |
          rm -rf /tmp/upd && mkdir /tmp/upd
          unzip -q incoming/update.zip -d /tmp/upd
          if [ "$(ls -A /tmp/upd | wc -l)" = "1" ] && [ -d "/tmp/upd/$(ls /tmp/upd)" ]; then
            mv /tmp/upd/*/* /tmp/upd/ 2>/dev/null || true
          fi
          rm -rf /tmp/upd/.github /tmp/upd/incoming
          # после распаковки: ни одной ссылки и ни одного файла вне папки
          if find /tmp/upd -type l | grep .; then echo "Найдены ссылки"; exit 1; fi
          cp -a /tmp/upd/. ./
          git rm -q --cached incoming/update.zip
          rm -f incoming/update.zip
      - name: Коммит
        run: |
          git config user.name "zavezen-bot"
          git config user.email "zavezen-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Изменений нет"; exit 0; }
          git commit -m "Обновление проекта из архива"
          git push
      - name: Запуск публикации
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
